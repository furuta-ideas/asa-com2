<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Asa-Com2">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no">
<title>あさちゃんコミュニケーションボード Asa-Com2</title>
<style>
/* ============================================================
   Asa-Com2  /  Material Design 3 準拠トークン（Asa-Com と共通）
   ============================================================ */
:root{
  --split:5fr 2fr;
  --primary:#1A73E8;
  --surface:#FFFFFF;
  --surface-variant:#F1F3F4;
  --outline:#DADCE0;
  --on-surface:#202124;
  --on-surface-variant:#5F6368;
  --danger:#EA4335;
  --warn:#F9AB00;
  --shadow-1:0 1px 3px rgba(60,64,67,.3),0 1px 2px rgba(60,64,67,.15);
  --shadow-2:0 2px 6px rgba(60,64,67,.3);
  --ease:cubic-bezier(.2,0,0,1);
  --font-scale:1;
  --edge:16px;
  --rowh:clamp(78px, 15vh, 124px);
}
body.hc{
  --surface:#000000;
  --surface-variant:#0A0A0A;
  --outline:#FFFFFF;
  --on-surface:#FFFFFF;
  --on-surface-variant:#E0E0E0;
  --primary:#8AB4F8;
  --shadow-1:none;
  --shadow-2:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:var(--surface);color:var(--on-surface);
  overflow:hidden;-webkit-user-select:none;user-select:none;
  touch-action:manipulation;overscroll-behavior:none;
}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0}

/* ---------- レイアウト ---------- */
#app{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{height:56px;flex:0 0 auto;display:flex;align-items:center;
  padding:0 var(--edge);border-bottom:1px solid var(--outline);gap:12px}
header .brand{font-size:20px;font-weight:600;letter-spacing:.02em}
header .build{font-size:12px;color:var(--on-surface-variant);white-space:nowrap;
  align-self:flex-end;padding-bottom:6px}
header .sp{flex:1}
#gear{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
#gear:active{background:var(--surface-variant)}
#gear svg{width:26px;height:26px;fill:var(--on-surface-variant)}

#soundWarn{position:fixed;left:0;right:0;top:56px;z-index:15;
  display:flex;align-items:center;gap:12px;padding:10px var(--edge);
  background:#FEF7E0;color:#7A4E00;border-bottom:1px solid #F9AB00;font-size:15px;
  box-shadow:var(--shadow-1)}
@media (max-height:560px){ #soundWarn{top:48px;padding:6px var(--edge);font-size:13px} }
#soundWarn[hidden]{display:none}
#soundWarn span{flex:1}
#soundWarn button{border:2px solid #7A4E00;border-radius:18px;height:36px;padding:0 14px;
  font-size:14px;font-weight:700;color:#7A4E00}
#soundWarn #soundWarnClose{width:36px;padding:0}
#main{flex:1;min-height:0;min-width:0;overflow:hidden;display:grid;grid-template-columns:var(--split)}
body.logHidden #main{grid-template-columns:1fr 150px}
body.logHidden #log,body.logHidden #logOff{display:none}
#left{min-width:0;min-height:0;overflow:hidden;display:grid;grid-template-rows:auto 1fr}

/* ---------- 入力中の行（手書き＋認識文字のペア） ---------- */
#row{height:calc(var(--rowh)*var(--font-scale));flex:0 0 auto;display:flex;align-items:center;
  gap:10px;padding:8px var(--edge);border-bottom:1px solid var(--outline);background:var(--surface)}
#cellsWrap{flex:1;min-width:0;height:100%;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;display:flex;align-items:center}
#cells{display:flex;gap:8px;align-items:center;min-height:100%;padding:2px}
.cell{position:relative;flex:0 0 auto;height:calc(var(--rowh)*var(--font-scale) - 26px);
  width:calc((var(--rowh)*var(--font-scale) - 26px)*.82);
  border:2px solid var(--outline);border-radius:12px;background:var(--surface);
  color:var(--on-surface);overflow:hidden;
  transition:border-color .2s var(--ease),background .2s var(--ease)}
.cell svg{position:absolute;inset:6%;width:88%;height:88%}
.cell svg polyline{fill:none;stroke:currentColor;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round}
.cell .glyph{position:absolute;inset:0;display:grid;place-items:center;
  font-size:calc((var(--rowh)*var(--font-scale) - 26px)*.5);font-weight:700}
.cell .ch{position:absolute;right:3px;bottom:1px;
  font-size:calc((var(--rowh)*var(--font-scale) - 26px)*.30);font-weight:700;
  line-height:1;color:var(--primary);background:var(--surface);padding:1px 3px;border-radius:5px}
.cell.low .ch{color:#B06000;box-shadow:inset 0 -3px 0 var(--warn)}
.cell.hi{border-color:var(--primary);background:rgba(26,115,232,.10)}
.cell.del{border-color:var(--danger);background:rgba(234,67,53,.14)}
#rowEmpty{flex:1;color:var(--on-surface-variant);opacity:.7;
  font-size:calc(20px*var(--font-scale));padding-left:4px}

/* ---------- 手書きキャンバス（左ペイン全体） ---------- */
#padWrap{position:relative;min-height:0;margin:10px var(--edge) var(--edge);
  border:3px solid var(--outline);border-radius:20px;background:var(--surface);overflow:hidden}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#padWrap.shake{animation:shake .12s 2 var(--ease)}
@keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}100%{transform:translateX(0)}}
#cands{flex:0 0 auto;display:flex;gap:6px;padding:0 10px;flex-wrap:wrap}
#cands:empty{display:none}
#cands .chip{flex:1 1 0;min-width:0;height:48px;padding:0 10px;border-radius:24px;
  border:2px solid var(--primary);background:var(--surface);box-shadow:var(--shadow-1);
  display:flex;align-items:center;justify-content:center;gap:4px;font-size:24px;font-weight:700;
  color:var(--primary)}
#cands .chip small{font-size:11px;font-weight:400;color:var(--on-surface-variant)}
#cands .chip:active{background:var(--surface-variant)}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:rgba(32,33,36,.86);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:20px;opacity:0;transition:opacity .2s var(--ease);pointer-events:none;white-space:nowrap}
#hint.on{opacity:1}
#teachBar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--primary);color:#fff;font-size:20px;font-weight:600}
#teachBar[hidden]{display:none}
#teachBar #teachMsg{flex:1}
#teachBar button{background:#fff;color:var(--primary);border-radius:20px;height:40px;padding:0 18px;
  font-size:16px;font-weight:700}
/* おぼえさせる文字えらび */
#teachPick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
#teachPick button{height:44px;border:2px solid var(--outline);border-radius:10px;font-size:20px;
  font-weight:700;background:var(--surface)}
#teachPick button.has{border-color:var(--primary);color:var(--primary)}
#teachPick button:active{background:var(--surface-variant)}

/* ---------- 右：ログ＋介助者用ボタン ---------- */
#side{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  border-left:1px solid var(--outline);background:var(--surface-variant)}
#log{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 10px}
.logItem{border-left:4px solid var(--primary);padding:4px 0 8px 10px;margin-bottom:10px}
.logItem .t{font-size:12px;color:var(--on-surface-variant)}
.logItem .b{font-size:calc(20px*var(--font-scale));font-weight:500;word-break:break-all;line-height:1.35}
.logDate{font-size:12px;color:var(--on-surface-variant);text-align:center;margin:6px 0 10px;
  border-bottom:1px solid var(--outline);line-height:0}
.logDate span{background:var(--surface-variant);padding:0 8px}
#logOff{display:none;flex:1;place-items:center;color:var(--on-surface-variant);font-size:17px;opacity:.8}
body.logOff #logOff{display:grid}
body.logOff #log{display:none}

#keys{flex:0 0 auto;min-width:0;border-top:1px solid var(--outline);padding:8px 10px 4px}
#keys .grid button{min-width:0}
body.noKeys #keys{display:none}
#keys .cap{font-size:11px;color:var(--on-surface-variant);margin-bottom:6px;text-align:center}
#keys .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.key{height:52px;border-radius:14px;border:2px solid var(--outline);background:var(--surface);
  font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1}
.key b{font-size:26px;line-height:1}
.key i{font-style:normal;font-size:10px;font-weight:400;color:var(--on-surface-variant);margin-top:2px}
.key.sm b{font-size:16px}
.key:active{background:var(--surface-variant)}
.key[disabled]{opacity:.3}
.key.accent{border-color:var(--primary);color:var(--primary)}
.key.del{border-color:var(--danger);color:var(--danger)}

#ctrl{flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;gap:8px;
  padding:10px 8px 26px}
.toggle{width:64px;height:64px;border-radius:50%;border:2px solid var(--outline);
  display:grid;place-items:center;position:relative;background:var(--surface)}
.toggle svg{width:30px;height:30px;fill:var(--on-surface-variant)}
.toggle.on{background:var(--primary);border-color:var(--primary)}
.toggle.on svg{fill:#fff}
.toggle .slash{position:absolute;width:44px;height:3px;background:var(--on-surface-variant);
  transform:rotate(-45deg);border-radius:2px}
.toggle.on .slash{display:none}
.toggle .cap{position:absolute;bottom:-17px;font-size:11px;color:var(--on-surface-variant);white-space:nowrap}

/* ---------- 設定シート ---------- */
#scrim{position:fixed;inset:0;background:rgba(32,33,36,.45);opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease);z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:21;right:0;top:0;bottom:0;width:min(520px,92vw);
  background:var(--surface);box-shadow:var(--shadow-2);transform:translateX(102%);
  transition:transform .25s var(--ease);display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheet header{border-bottom:1px solid var(--outline)}
#sheetBody{flex:1;overflow-y:auto;padding:8px 20px 40px}
.sec{margin-top:18px;font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.06em}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--outline)}
.item .lb{flex:1;font-size:16px}
.item .lb small{display:block;color:var(--on-surface-variant);font-size:12px;margin-top:2px}
.sw{width:56px;height:32px;border-radius:16px;background:var(--outline);position:relative;flex:0 0 auto;
  transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-1);transition:transform .2s var(--ease)}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(24px)}
select{font-family:inherit;font-size:16px;padding:8px 10px;border-radius:10px;
  border:1px solid var(--outline);background:var(--surface);color:var(--on-surface);max-width:52%}
.act{display:block;width:100%;margin-top:12px;height:52px;border-radius:26px;border:2px solid var(--outline);
  font-size:16px;font-weight:600}
.act:active{background:var(--surface-variant)}
.act.danger{color:var(--danger);border-color:var(--danger)}

/* ---------- 起動オーバーレイ・トースト ---------- */
#start{position:fixed;inset:0;z-index:30;background:var(--surface);display:grid;place-items:center;
  text-align:center;padding:24px;border:none;width:100%;font:inherit;color:inherit;
  -webkit-appearance:none;appearance:none}
#start .in{font-size:28px;font-weight:600;line-height:1.7}
#start .in small{display:block;font-size:16px;color:var(--on-surface-variant);margin-top:14px;font-weight:400}
#start .in small#buildStart{font-size:13px;margin-top:20px;opacity:.75}
#start{overflow:auto}
#guide{margin:22px auto 0;max-width:660px;text-align:left;border:2px solid var(--outline);
  border-radius:18px;padding:12px 18px 14px}
#guide .grow.lead{padding-top:4px}
#guide .grow.lead .gtx{font-size:18px;color:var(--primary)}
#guide svg text{font-family:inherit}
#guide svg text.gmuted{fill:var(--on-surface-variant);stroke:none;font-weight:400}
#guide svg .gslash{stroke:var(--danger);stroke-width:3;stroke-linecap:round}
/* 画面がとても低いとき（iPhone 横など）は、さらに詰めて全部読めるようにする */
@media (max-height:480px){
  #start{align-items:start;padding:12px 16px}
  #start .in{font-size:19px}
  #start .in small{margin-top:6px;font-size:13px}
  #guide{margin-top:10px;padding:6px 12px 8px;max-width:760px}
  #guide .gt{margin-bottom:4px}
  #guide .grow{padding:4px 0;gap:10px}
  #guide .gfig{width:66px;height:36px}
  #guide .gcells{width:66px;gap:5px}
  #guide .gcell{width:30px;height:36px}
  #guide .gch{font-size:12px}
  #guide .gtx{font-size:13.5px;line-height:1.35}
  #guide .gtx i{font-size:11px;margin-top:1px}
  #guide .grow.lead .gtx{font-size:15px}
  #start .in small#buildStart{margin-top:8px;font-size:11px}
}
@media (max-height:700px){
  #guide{margin-top:14px;padding:8px 14px 10px}
  #guide .grow{padding:5px 0}
  #guide .gfig{width:84px;height:44px}
  #guide .gtx{font-size:15px;line-height:1.4}
  #guide .gtx i{font-size:12px}
  #guide .gcells{width:84px}
  #guide .gcell{width:38px;height:44px}
  #start .in{font-size:22px}
  #start .in small{margin-top:8px;font-size:14px}
}
#guide .gt{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.08em;margin-bottom:8px}
#guide .grow{display:flex;align-items:center;gap:14px;padding:9px 0;border-top:1px solid var(--outline)}
#guide .grow:first-of-type{border-top:none}
#guide .gfig{flex:0 0 auto;width:104px;height:56px}
#guide svg polyline,#guide svg circle{fill:none;stroke:var(--on-surface);stroke-width:6;
  stroke-linecap:round;stroke-linejoin:round}
#guide svg text{fill:var(--on-surface-variant);stroke:none;font-family:inherit}
#guide .gtx{font-size:17px;font-weight:400;line-height:1.5;color:var(--on-surface)}
#guide .gtx b{font-weight:700}
#guide .gtx b.blue{color:var(--primary)}
#guide .gtx b.amber{color:#B06000;box-shadow:inset 0 -3px 0 var(--warn)}
#guide .gtx i{display:block;font-style:normal;font-size:13px;color:var(--on-surface-variant);margin-top:2px}
#guide .gcells{display:flex;gap:8px;width:104px}
#guide .gcell{position:relative;width:48px;height:56px;border:2px solid var(--outline);border-radius:8px}
#guide .gcell svg{position:absolute;inset:8%;width:84%;height:84%}
#guide .gcell svg polyline{stroke-width:7}
#guide .gch{position:absolute;right:2px;bottom:0;font-size:17px;font-weight:700;line-height:1;
  color:var(--primary);background:var(--surface);padding:0 2px;border-radius:4px}
#guide .gch.low{color:#B06000;box-shadow:inset 0 -3px 0 var(--warn)}
#start.off{display:none}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:40;
  background:rgba(32,33,36,.92);color:#fff;padding:12px 22px;border-radius:24px;font-size:17px;
  opacity:0;pointer-events:none;transition:opacity .2s var(--ease);max-width:80vw;text-align:center}
#toast.on{opacity:1}
/* 画面が低いとき（iPhone 横など）：操作ボタンが必ず見えるように詰める */
@media (max-height:560px){
  header{height:48px}
  header .brand{font-size:17px}
  header .build{font-size:11px;padding-bottom:4px}
  #padWrap{margin:8px var(--edge) 10px;border-width:2px}
  .toggle{width:50px;height:50px}
  .toggle svg{width:24px;height:24px}
  .toggle .cap{bottom:-14px;font-size:10px}
  #ctrl{padding:8px 6px 20px;gap:6px}
  #keys{padding:6px 8px 2px}
  #keys .cap{margin-bottom:3px}
  .key{height:42px}
  .key b{font-size:20px}
  .key i{display:none}
  #cands .chip{height:40px;font-size:20px}
  .logItem{margin-bottom:6px}
}
/* 画面が狭いとき（iPhone など）：ログ欄の割合を広げて読めるようにする */
@media (max-width:900px) and (orientation:landscape){
  :root{--split:4fr 2fr}
  #guide{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (orientation:portrait){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(0,3fr) minmax(140px,1fr)}
  #side{border-left:none;border-top:1px solid var(--outline)}
  #ctrl{padding-bottom:22px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Asa-Com2</div>
    <div class="build" id="build" aria-label="このアプリの更新日時"></div>
    <div class="sp"></div>
    <button id="gear" aria-label="設定">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54c-.58.24-1.12.56-1.62.94l-2.39-.96a.5.5 0 00-.6.22L2.71 8.84a.5.5 0 00.12.64l2.03 1.58a7.07 7.07 0 000 1.88l-2.03 1.58a.5.5 0 00-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.56 1.62-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>
    </button>
  </header>

  <div id="soundWarn" hidden>
    <span>音が出ていません。<b>画面をもう一度さわる</b>と鳴ることがあります（iPad の音量・消音もご確認ください）</span>
    <button id="soundWarnTest">音を出してみる</button>
    <button id="soundWarnClose" aria-label="とじる">✕</button>
  </div>

  <div id="main">
    <section id="left">
      <div id="row">
        <div id="cellsWrap"><div id="cells"></div></div>
        <div id="rowEmpty">ここに かいた もじが でます</div>
      </div>
      <!-- 左ペインの残り全部が書く面（本人がボタンに触れないよう、ボタンは右側に置く） -->
      <div id="padWrap">
        <canvas id="pad"></canvas>
        <div id="hint"></div>
        <div id="teachBar" hidden>
          <span id="teachMsg"></span>
          <button id="teachStop">やめる</button>
        </div>
      </div>
    </section>

    <aside id="side">
      <div id="log" role="log" aria-live="polite"></div>
      <div id="logOff">ログは OFF です</div>

      <div id="cands" aria-label="ほかの候補"></div>

      <div id="keys">
        <div class="cap">介助者用</div>
        <div class="grid">
          <button class="key" id="kDaku" aria-label="濁点をつける"><b>゛</b><i>にごる</i></button>
          <button class="key" id="kHan" aria-label="半濁点をつける"><b>゜</b><i>ぱぴぷ</i></button>
          <button class="key" id="kChoon" aria-label="長音を入れる"><b>ー</b><i>のばす</i></button>
          <button class="key accent" id="kPeriod" aria-label="文を確定して読み上げる"><b>。</b><i>ぶんの おわり</i></button>
          <button class="key del sm" id="kDel" aria-label="1文字けす"><b>けす</b><i>1もじ</i></button>
          <button class="key sm" id="kRead" aria-label="いまの行を読み上げる"><b>よみあげ</b><i>いまの行</i></button>
        </div>
      </div>

      <div id="ctrl">
        <button class="toggle" id="tSpeak" aria-label="読み上げ">

<script>
/* ==CNN-BEGIN==  Asa-Com2 手書き認識CNN（内蔵モデル・外部ライブラリなし）
   ------------------------------------------------------------------
   学習：筆画テンプレートを崩した手書き風の画像＋日本語フォントの字形（6万枚超）
   構成：3x3畳み込み ×4（BatchNorm は重みへ畳み込み済み）→ 全体平均 → 全結合
   重み：int8量子化（読み込み時に実数へ戻す）
   入力：筆跡を 48x48 に正規化した画像（線=1 / 紙=0）
   出力：文字ごとの確からしさ（合計1）
   ------------------------------------------------------------------ */
var CNN = (function(){
'use strict';

var M = null;
var MARGIN = 4;      /* 学習時と同じ余白 */
var SS = 2;          /* ラスタライズ時の細かさ（滑らかにするため） */

/* base64 → int8 の並び（atob が無い環境でも同じ結果になるよう自前で展開する） */
var B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
var B64R=(function(){ var m={}; for(var i=0;i<B64.length;i++) m[B64.charAt(i)]=i; return m; })();
function unb64(str, scale){
  var clean=str.replace(/=+$/,''), n=(clean.length*3)>>2, out=new Float32Array(n), p=0, buf=0, bits=0;
  for(var i=0;i<clean.length;i++){
    buf=(buf<<6)|B64R[clean.charAt(i)]; bits+=6;
    if(bits>=8){
      bits-=8;
      var v=(buf>>bits)&255;
      out[p++]=(v>127 ? v-256 : v)*scale;
    }
  }
  return p===n ? out : out.subarray(0,p);
}

function load(spec){
  if(!spec || !spec.layers) return null;
  var L=[], i;
  for(i=0;i<spec.layers.length;i++){
    var l=spec.layers[i];
    L.push({type:l.type, shape:l.shape, w:unb64(l.w, l.scale), b:Float32Array.from(l.b)});
  }
  M={size:spec.size, classes:spec.classes, layers:L, index:{}};
  for(i=0;i<M.classes.length;i++) M.index[M.classes[i]]=i;
  return M;
}
function ready(){ return !!M; }
function classes(){ return M ? M.classes : []; }

/* ---------- 筆跡 → 48x48 の画像 ---------- */
/* strokes: [[{x,y},…],…]（キャンバス座標）／penRatio: 線の太さ ÷ 字の大きさ */
function rasterize(strokes, penRatio){
  var S = M ? M.size : 48, N = S*SS, i, j;
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  for(i=0;i<strokes.length;i++) for(j=0;j<strokes[i].length;j++){
    var p=strokes[i][j];
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  if(minX>maxX) return null;
  var w=maxX-minX, h=maxY-minY, scale=Math.max(w,h,1e-6);
  var inner=S-2*MARGIN, k=inner/scale;
  var ox=(MARGIN+(inner-w*k)/2-minX*k)*SS, oy=(MARGIN+(inner-h*k)/2-minY*k)*SS;
  var big=new Float32Array(N*N);
  var r=Math.max(1.2, Math.min(0.18, Math.max(0.05, penRatio||0.09))*S*SS/2);
  for(i=0;i<strokes.length;i++){
    var st=strokes[i];
    if(st.length===1){ dot(big,N,st[0].x*k*SS+ox, st[0].y*k*SS+oy, r); continue; }
    for(j=1;j<st.length;j++){
      segment(big, N,
        st[j-1].x*k*SS+ox, st[j-1].y*k*SS+oy,
        st[j].x*k*SS+ox,   st[j].y*k*SS+oy, r);
    }
  }
  /* SSxSS を平均して 48x48 に落とす */
  var img=new Float32Array(S*S), area=SS*SS;
  for(var y=0;y<S;y++){
    for(var x=0;x<S;x++){
      var s=0;
      for(var dy=0;dy<SS;dy++){
        var row=(y*SS+dy)*N + x*SS;
        for(var dx=0;dx<SS;dx++) s+=big[row+dx];
      }
      img[y*S+x]=s/area;
    }
  }
  return img;
}

function dot(buf,N,cx,cy,r){ segment(buf,N,cx,cy,cx+0.01,cy+0.01,r); }

/* 太さ 2r の線分を、端の滑らかさ込みで塗る */
function segment(buf,N,x0,y0,x1,y1,r){
  var lo_x=Math.max(0, Math.floor(Math.min(x0,x1)-r-1));
  var hi_x=Math.min(N-1, Math.ceil(Math.max(x0,x1)+r+1));
  var lo_y=Math.max(0, Math.floor(Math.min(y0,y1)-r-1));
  var hi_y=Math.min(N-1, Math.ceil(Math.max(y0,y1)+r+1));
  var dx=x1-x0, dy=y1-y0, len2=dx*dx+dy*dy;
  for(var y=lo_y;y<=hi_y;y++){
    for(var x=lo_x;x<=hi_x;x++){
      var px=x+0.5-x0, py=y+0.5-y0;
      var t = len2>1e-9 ? (px*dx+py*dy)/len2 : 0;
      if(t<0) t=0; else if(t>1) t=1;
      var ex=px-dx*t, ey=py-dy*t;
      var d=Math.sqrt(ex*ex+ey*ey);
      var v = d<=r-0.5 ? 1 : (d>=r+0.5 ? 0 : (r+0.5-d));
      if(v>0){ var o=y*N+x; if(buf[o]<v) buf[o]=v; }
    }
  }
}

/* ---------- 推論 ---------- */
function conv3(x, Cin, H, W, L){
  var C=L.shape[0], w=L.w, b=L.b, out=new Float32Array(C*H*W);
  for(var oc=0; oc<C; oc++){
    var ob=oc*H*W, bias=b[oc];
    for(var y=0; y<H; y++){
      var orow=ob+y*W;
      for(var px=0; px<W; px++){
        var sum=bias;
        for(var ic=0; ic<Cin; ic++){
          var wo=(oc*Cin+ic)*9, xo=ic*H*W;
          for(var ky=-1; ky<=1; ky++){
            var yy=y+ky;
            if(yy<0 || yy>=H) continue;
            var xrow=xo+yy*W, kw=wo+(ky+1)*3;
            for(var kx=-1; kx<=1; kx++){
              var xx=px+kx;
              if(xx<0 || xx>=W) continue;
              sum += w[kw+kx+1] * x[xrow+xx];
            }
          }
        }
        out[orow+px] = sum>0 ? sum : 0;
      }
    }
  }
  return out;
}

function pool2(x, C, H, W){
  var H2=H>>1, W2=W>>1, out=new Float32Array(C*H2*W2);
  for(var c=0;c<C;c++){
    var si=c*H*W, di=c*H2*W2;
    for(var y=0;y<H2;y++){
      for(var px=0;px<W2;px++){
        var p=si+(y*2)*W+(px*2);
        var a=x[p], b=x[p+1], c2=x[p+W], d=x[p+W+1];
        var m=a>b?a:b; if(c2>m)m=c2; if(d>m)m=d;
        out[di+y*W2+px]=m;
      }
    }
  }
  return out;
}

function forward(img){
  if(!M) return null;
  var L=M.layers, H=M.size, W=M.size, i;
  var h=conv3(img, 1, H, W, L[0]);
  h=pool2(h, L[0].shape[0], H, W); H>>=1; W>>=1;
  h=conv3(h, L[0].shape[0], H, W, L[1]);
  h=pool2(h, L[1].shape[0], H, W); H>>=1; W>>=1;
  h=conv3(h, L[1].shape[0], H, W, L[2]);
  h=pool2(h, L[2].shape[0], H, W); H>>=1; W>>=1;
  h=conv3(h, L[2].shape[0], H, W, L[3]);
  var C=L[3].shape[0], area=H*W, gap=new Float32Array(C);
  for(var c=0;c<C;c++){
    var s=0, o=c*area;
    for(i=0;i<area;i++) s+=h[o+i];
    gap[c]=s/area;
  }
  var D=L[4], nc=D.shape[0], out=new Float32Array(nc), k, jj;
  for(k=0;k<nc;k++){
    var acc=D.b[k], off=k*C;
    for(jj=0;jj<C;jj++) acc+=D.w[off+jj]*gap[jj];
    out[k]=acc;
  }
  var mx=-1e30;
  for(k=0;k<nc;k++) if(out[k]>mx) mx=out[k];
  var sum=0;
  for(k=0;k<nc;k++){ out[k]=Math.exp(out[k]-mx); sum+=out[k]; }
  for(k=0;k<nc;k++) out[k]/=sum;
  return out;
}

/* 筆跡から直接、文字ごとの確からしさを得る */
function probs(strokes, penRatio){
  if(!M) return null;
  var img=rasterize(strokes, penRatio);
  return img ? forward(img) : null;
}

return { load:load, ready:ready, classes:classes,
         probs:probs, forward:forward, rasterize:rasterize };
})();
/* ==CNN-END== */
</script>

/* ---------- 幾何ユーティリティ ---------- */
function dist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

function pathLen(p){ var L=0; for(var i=1;i<p.length;i++) L+=dist(p[i-1],p[i]); return L; }

function resample(pts, n){
  if(!pts.length) return [];
  if(pts.length===1){ var o=[]; for(var k=0;k<n;k++) o.push({x:pts[0].x,y:pts[0].y}); return o; }
  var L=pathLen(pts);
  if(L<1e-9){ var o2=[]; for(var k2=0;k2<n;k2++) o2.push({x:pts[0].x,y:pts[0].y}); return o2; }
  var step=L/(n-1), out=[{x:pts[0].x,y:pts[0].y}], D=0, i;
  var src=pts.slice();
  for(i=1;i<src.length;i++){
    var d=dist(src[i-1],src[i]);
    if(d<1e-12) continue;
    if(D+d>=step){
      var t=(step-D)/d;
      var nx=src[i-1].x+t*(src[i].x-src[i-1].x);
      var ny=src[i-1].y+t*(src[i].y-src[i-1].y);
      out.push({x:nx,y:ny});
      src.splice(i,0,{x:nx,y:ny});
      D=0;
    } else D+=d;
  }
  while(out.length<n) out.push({x:src[src.length-1].x,y:src[src.length-1].y});
  return out.slice(0,n);
}

/* 筆跡 → 特徴（重心原点・最大辺で正規化／縦横比は保持） */
function featurize(strokes){
  var rs=[], i, j;
  for(i=0;i<strokes.length;i++) rs.push(resample(strokes[i], N));
  var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9, sx=0, sy=0, cnt=0;
  for(i=0;i<rs.length;i++) for(j=0;j<N;j++){
    var p=rs[i][j];
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    sx+=p.x; sy+=p.y; cnt++;
  }
  var w=maxX-minX, h=maxY-minY, scale=Math.max(w,h);
  if(scale<1e-6) scale=1;
  var cx=sx/cnt, cy=sy/cnt;
  var out=[], dirs=[];
  for(i=0;i<rs.length;i++){
    var s=[];
    for(j=0;j<N;j++) s.push({x:(rs[i][j].x-cx)/scale, y:(rs[i][j].y-cy)/scale});
    out.push(s);
    var dx=s[N-1].x-s[0].x, dy=s[N-1].y-s[0].y, L=Math.sqrt(dx*dx+dy*dy);
    dirs.push(L<1e-6?{x:0,y:0}:{x:dx/L,y:dy/L});
  }
  return { st:out, dirs:dirs, n:rs.length, rw:w/scale, rh:h/scale,
           box:{x:minX,y:minY,w:w,h:h} };
}

/* 1画どうしのコスト（逆向きも試す） */
function strokePair(a,b,da,db){
  var f=0,r=0,i;
  for(i=0;i<N;i++){
    f+=dist(a[i],b[i]);
    r+=dist(a[i],b[N-1-i]);
  }
  f/=N; r/=N;
  /* 閉じた画（始点＝終点）は方向ベクトルが定まらないので方向項を使わない */
  var za=(da.x===0&&da.y===0), zb=(db.x===0&&db.y===0);
  var cf, cr;
  if(za||zb){
    var pen = (za&&zb) ? 0 : W_DIR*0.5;
    cf=f+pen; cr=r+pen+REV_PEN;
  }else{
    var dotF=da.x*db.x+da.y*db.y;
    cf=f + W_DIR*(1-dotF)/2;
    cr=r + W_DIR*(1+dotF)/2 + REV_PEN;
  }
  return cf<=cr ? cf : cr;
}

/* 特徴どうしのコスト（画数は同じ前提） */
function featCost(A,B){
  var n=A.n, i, j;
  /* 1) 筆順どおりの対応 */
  var c1=0;
  for(i=0;i<n;i++) c1+=strokePair(A.st[i],B.st[i],A.dirs[i],B.dirs[i]);
  c1/=n;
  var best=c1;
  /* 2) 順不同の対応（貪欲法）— 画数3以下のときのみ試す */
  if(n>1 && n<=4){
    var m=[], used=[];
    for(i=0;i<n;i++){ m.push([]); used.push(false);
      for(j=0;j<n;j++) m[i].push(strokePair(A.st[i],B.st[j],A.dirs[i],B.dirs[j]));
    }
    var total=0, same=true;
    for(i=0;i<n;i++){
      var bi=-1, bv=1e9;
      for(j=0;j<n;j++) if(!used[j] && m[i][j]<bv){ bv=m[i][j]; bi=j; }
      used[bi]=true; total+=bv; if(bi!==i) same=false;
    }
    total=total/n + (same?0:ORD_PEN);
    if(total<best) best=total;
  }
  /* 3) 縦横比 */
  best += W_ASPECT*(Math.abs(A.rw-B.rw)+Math.abs(A.rh-B.rh))/2;
  return best;
}

/* ---------- テンプレートの前計算 ---------- */
function toPts(flat){
  var p=[]; for(var i=0;i<flat.length;i+=2) p.push({x:flat[i],y:flat[i+1]});
  return p;
}
var TPL=[];   // 完成形
var PRE={};   // prefix: PRE[k] = [{ch,feat}…]（k画まで書いた時点の見込み用）
(function(){
  for(var i=0;i<RAW.length;i++){
    var r=RAW[i], strokes=r.s.map(toPts);
    TPL.push({ch:r.ch, kind:r.kind, n:strokes.length, feat:featurize(strokes)});
    for(var k=1;k<strokes.length;k++){
      if(!PRE[k]) PRE[k]=[];
      PRE[k].push({ch:r.ch, kind:r.kind, feat:featurize(strokes.slice(0,k))});
    }
  }
})();

/* ---------- 認識 ---------- */
function allowed(kind, opt){
  if(opt && opt.digitsOnly) return kind==='digit' || kind==='mark';
  if(opt && opt.useDigits===false) return kind!=='digit';
  return true;
}

/* 最終スコア ＝ CNN の確からしさ ＋ 0.30 × 筆画マッチング（上限1.0）
   足し算にしているのは、画数が手本と違う字（指で書くと頻繁に起きる）で
   筆画マッチングが 0 になっても、それだけで不利にならないようにするため。 */
var W_TMPL = 0.30;
var DIGIT_PRIOR = 0.55;   /* 数字はカタカナより出にくい、として確からしさを割り引く */
var INK_HIT = 0.72, INK_MARGIN = 0.06;   /* 覚えた筆跡と「ほぼ一致」とみなす線 */

function recognize(strokes, opt){
  opt = opt||{};
  var k=strokes.length;
  if(!k) return {cands:[], continuable:false};
  var A=featurize(strokes);
  var byCh={}, i, ch;
  for(i=0;i<TPL.length;i++){
    var t=TPL[i];
    if(t.n!==k) continue;
    if(!allowed(t.kind,opt)) continue;
    var c=featCost(A,t.feat);
    if(byCh[t.ch]===undefined || c<byCh[t.ch]) byCh[t.ch]=c;
  }
  /* 筆画マッチングのスコア（0〜1） */
  var tscore={};
  for(ch in byCh) tscore[ch]=Math.max(0, 1-byCh[ch]/COST_MAX);

  /* CNN（字の形）と合わせる。CNN が使えない環境では筆画マッチングだけで動く */
  var cands=[];
  var probs = (typeof CNN!=='undefined' && CNN.ready())
              ? CNN.probs(strokes, opt.penRatio) : null;
  if(probs){
    var cls=CNN.classes(), sum=0, keep=[], adj=[];
    var prior = (opt.kanaFirst===false || opt.digitsOnly) ? 1 : DIGIT_PRIOR;
    for(i=0;i<cls.length;i++){
      if(!allowed(/[0-9]/.test(cls[i])?'digit':(cls[i]==='ー'?'mark':'kana'), opt)) continue;
      var pv0=probs[i]*(/[0-9]/.test(cls[i]) ? prior : 1);
      keep.push(i); adj.push(pv0); sum+=pv0;
    }
    if(sum<=0) sum=1;
    var ink=opt.ink||null, bmap=(ink&&ink.map)||null;
    for(i=0;i<keep.length;i++){
      ch=cls[keep[i]];
      var pv=adj[i]/sum, tv=tscore[ch]||0;
      var sc=Math.min(0.99, pv + W_TMPL*tv);   /* 1.00 は「覚えた字と一致」のために空けておく */
      if(bmap && bmap[ch]) sc=Math.min(0.99, sc + bmap[ch]);   /* 覚えた字による後押し */
      cands.push({ch:ch, cnn:pv, tmpl:tv, score:sc});
    }
    /* 覚えた筆跡とほぼ一致するなら、それを最優先にする（本人の書きかたが最終的な根拠） */
    if(ink && ink.top && ink.top.ch && ink.top.sim>=INK_HIT && (ink.top.sim-ink.second)>=INK_MARGIN){
      for(i=0;i<cands.length;i++) if(cands[i].ch===ink.top.ch){
        cands[i].score=1;
        cands[i].ink=ink.top.sim;
        break;
      }
    }
  } else {
    for(ch in tscore) cands.push({ch:ch, cnn:0, tmpl:tscore[ch], score:tscore[ch]});
  }
  cands.sort(function(a,b){ return b.score-a.score; });
  cands=cands.slice(0,3);

  /* 書き足しの見込み（この画数より多い字の前半と一致するか） */
  var cont=false, list=PRE[k]||[];
  var bestCost = 9;
  for(ch in byCh) if(byCh[ch]<bestCost) bestCost=byCh[ch];
  for(i=0;i<list.length;i++){
    if(!allowed(list[i].kind,opt)) continue;
    var pc=featCost(A,list[i].feat);
    if(pc<CONT_COST && pc<bestCost+0.10){ cont=true; break; }
  }
  return {cands:cands, continuable:cont};
}

/* ---------- ジェスチャ判定 ---------- */
/* ジグザグ（1画・横方向の折り返し3回以上） */
function isZigzag(strokes, cell, level){
  if(strokes.length!==1) return false;
  var p=strokes[0];
  if(p.length<8) return false;
  var need = level==='loose'?3:(level==='strict'?4:3);
  var ampR = level==='loose'?0.09:(level==='strict'?0.16:0.12);
  var minLen= (level==='loose'?1.0:(level==='strict'?1.5:1.2))*cell;
  var L=pathLen(p);
  if(L<minLen) return false;
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(var i=0;i<p.length;i++){
    if(p[i].x<minX)minX=p[i].x; if(p[i].x>maxX)maxX=p[i].x;
    if(p[i].y<minY)minY=p[i].y; if(p[i].y>maxY)maxY=p[i].y;
  }
  var w=maxX-minX, h=maxY-minY;
  if(w < h*0.8) return false;                 // 主方向が横
  if(w < cell*0.3) return false;
  /* x方向の折り返し回数（微小な揺れは無視） */
  var amp=Math.max(w*ampR, cell*0.06);
  var turns=0, dir=0, ext=p[0].x;
  for(var j=1;j<p.length;j++){
    var d=p[j].x-ext;
    if(dir===0){ if(Math.abs(d)>amp){ dir=d>0?1:-1; ext=p[j].x; } }
    else if(dir>0){ if(p[j].x>ext) ext=p[j].x; else if(ext-p[j].x>amp){ turns++; dir=-1; ext=p[j].x; } }
    else { if(p[j].x<ext) ext=p[j].x; else if(p[j].x-ext>amp){ turns++; dir=1; ext=p[j].x; } }
  }
  return turns>=need;
}

/* 小さく書かれた記号の判定
   戻り値 'daku'（2画の小さな点＝濁点）/ 'dot'（1画の小さな丸＝「。」または半濁点）/ null
   avg：直近に書かれた文字の大きさ（px）。分かる場合はそれを基準にする（本人の字の大きさに追随）*/
function markOf(strokes, cell, avg){
  if(!strokes.length || strokes.length>2) return null;
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,i,j,L=0;
  for(i=0;i<strokes.length;i++){
    L+=pathLen(strokes[i]);
    for(j=0;j<strokes[i].length;j++){
      var p=strokes[i][j];
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    }
  }
  var w=maxX-minX, h=maxY-minY, big=Math.max(w,h);
  var lim = avg>0 ? Math.max(avg*0.42, cell*0.08) : cell*0.24;
  if(big>lim) return null;
  if(L > (avg>0? avg*1.3 : cell*0.9)) return null;
  if(strokes.length===2) return 'daku';
  var asp=(w+1e-6)/(h+1e-6);
  if(asp>2.5 || asp<0.4) return null;   /* 細長い＝小さく書いた「ー」や「ノ」 */
  /* 1画の小さな記号：丸（閉じている）／点（ごく短い）＝'dot'、
     それ以外の走り書き（濁点を続けて1画で書いた形）＝'daku' */
  var q=strokes[0], p0=q[0], p1=q[q.length-1];
  var gap=Math.sqrt((p0.x-p1.x)*(p0.x-p1.x)+(p0.y-p1.y)*(p0.y-p1.y));
  if(gap < L*0.45 && L > big*2.0) return 'dot';        /* 閉じた丸 */
  if(L < big*1.2) return 'dot';                        /* ちょんと打った点 */
  /* 開いた形：縦か横に2回以上折り返していれば「濁点を1画で続けて書いた」とみなす */
  var amp=Math.max(big*0.25, 2);
  function turnsOn(axis){
    var t=0, dir=0, ext=q[0][axis];
    for(var i2=1;i2<q.length;i2++){
      var v=q[i2][axis], d=v-ext;
      if(dir===0){ if(Math.abs(d)>amp){ dir=d>0?1:-1; ext=v; } }
      else if(dir>0){ if(v>ext) ext=v; else if(ext-v>amp){ t++; dir=-1; ext=v; } }
      else { if(v<ext) ext=v; else if(v-ext>amp){ t++; dir=1; ext=v; } }
    }
    return t;
  }
  return Math.max(turnsOn('x'), turnsOn('y'))>=2 ? 'daku' : 'dot';
}

/* 表示用：筆跡を 0〜1 に正規化して保存（入力中の行のサムネイル用） */
function inkOf(strokes){
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,i,j;
  for(i=0;i<strokes.length;i++) for(j=0;j<strokes[i].length;j++){
    var p=strokes[i][j];
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  var w=Math.max(maxX-minX,1), h=Math.max(maxY-minY,1), s=Math.max(w,h);
  var ox=(s-w)/2, oy=(s-h)/2, out=[];
  for(i=0;i<strokes.length;i++){
    var a=[];
    for(j=0;j<strokes[i].length;j++){
      a.push(Math.round(((strokes[i][j].x-minX+ox)/s)*1000)/1000);
      a.push(Math.round(((strokes[i][j].y-minY+oy)/s)*1000)/1000);
    }
    out.push(a);
  }
  return out;
}

return { recognize:recognize, isZigzag:isZigzag, markOf:markOf, inkOf:inkOf,
         featurize:featurize, _tpl:TPL, _raw:RAW, N:N };
})();

var VOICES=[], theVoice=null;
function pickVoice(){

/* 単独で読ませると不自然になる文字の読み */
var READ={'ー':'ノバス','。':'マル',
  '0':'ゼロ','1':'イチ','2':'ニ','3':'サン','4':'ヨン','5':'ゴ','6':'ロク','7':'ナナ','8':'ハチ','9':'キュウ'};

/* ============================================================
   音声まわり
   iPadOS Safari で「起動しても声が出ない」ことがあるため、
   ・発話のエラー（not-allowed / audio-busy など）を必ず記録する
   ・鳴らないときは方法を変えて順に試す（下の LADDER）
   ・効いた方法を覚えて、次からはそれを使う
   ・何が起きたかを内部に記録しておく（不具合を追うときに使う）
   ============================================================ */
var speechReady=false, lastPrime=0;
var DIAG={events:[], lastError:null, worked:null};
function diag(kind, detail){
  DIAG.events.push({t:new Date(), kind:kind, detail:(detail===undefined?'':String(detail))});
  if(DIAG.events.length>40) DIAG.events.shift();
}

/* 発話の方法（上から順に試す）
   noVoice：声を指定しない（端末の既定にまかせる）
   quiet  ：先に効果音（WebAudio）を止める — iOSでは効果音が音声合成を黙らせることがある */
var LADDER=[
  {id:0, name:'そのまま',                 noVoice:false, quiet:false},
  {id:1, name:'効果音を止めてから',         noVoice:false, quiet:true },
  {id:2, name:'声を指定しないで',           noVoice:true,  quiet:false},
  {id:3, name:'声を指定せず効果音も止めて',  noVoice:true,  quiet:true }
];
function wayOf(id){
  for(var i=0;i<LADDER.length;i++) if(LADDER[i].id===id) return LADDER[i];
  return LADDER[0];
}

function makeUtterance(text, way){
  way = way || wayOf(S.speechWay);
  var u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP'; u.rate=S.rate; u.pitch=S.pitch;
  if(!way.noVoice){
    if(!theVoice) pickVoice();        /* 声の一覧は遅れて届くことがある */
    if(theVoice) u.voice=theVoice;
  }
  u.onstart=function(){
    speechReady=true; DIAG.worked=way.name;
    if(S.speechWay!==way.id){ S.speechWay=way.id; saveSettings(); }
    diag('鳴った', way.name+'／'+text);
    hideSoundWarn();
  };
  u.onend=function(){ speechReady=true; };
  u.onerror=function(ev){
    var code=(ev && ev.error) ? ev.error : 'unknown';
    DIAG.lastError=code;
    diag('エラー', code+'／'+way.name);
    if(code==='not-allowed') speechReady=false;       /* 次の操作で解錠し直す */
    if(code==='audio-busy' || code==='synthesis-unavailable') quietAudio();
  };
  return u;
}

/* 効果音（WebAudio）を止める。iOS で音声合成と取り合いになるのを避ける */
function quietAudio(){
  try{ if(AC && AC.state==='running') AC.suspend(); }catch(e){}
}

function speakWith(text, way, force){
  if(!('speechSynthesis' in window) || !text) return;
  way = way || wayOf(S.speechWay);
  try{
    var ss=window.speechSynthesis;
    if(way.quiet || S.quietForSpeech) quietAudio();
    if(ss.paused) ss.resume();
    if(force) ss.cancel();
    var u=makeUtterance(text, way);
    ss.speak(u);
    diag('発話した', way.name+'／'+text);
  }catch(e){ diag('例外', e && e.message); }
}

function say(text, opt){
  if(!S.speak || !('speechSynthesis' in window) || !text) return;
  speakWith(text, null, !!(S.cancelPrev || (opt&&opt.force)));
}

/* 音声合成の解錠（必ずユーザー操作の中から呼ぶこと） */
function primeSpeech(text, force, way){
  if(speechReady || !('speechSynthesis' in window)) return;
  var now=Date.now();
  if(!force && now-lastPrime < 1200) return;
  lastPrime=now;
  speakWith(text||'ア', way, false);
}

/* 起動時の音声立ち上げ。必ずユーザー操作の中から呼ぶこと。
   まず読み上げを OFF→ON し、覚えている方法で挨拶する。
   鳴らなければ 0.9秒ごとに方法を変えて試し、鳴った方法を覚える。 */
var GREETING='じゅんびが できました。かいて ください。';
function bootSpeech(){
  if(!('speechSynthesis' in window)){ diag('非対応','この端末では音声合成が使えません'); return; }
  diag('起動', '声の数='+VOICES.length+'／覚えている方法='+wayOf(S.speechWay).name);
  try{
    var ss=window.speechSynthesis;
    ss.cancel();                       /* 詰まっている状態を一度きれいにする */
    S.speak=false; updateToggles();    /* 読み上げ OFF */
    S.speak=true;  updateToggles();    /* 読み上げ ON（自動の切り替え） */
    speechReady=false;
    if(ss.paused) ss.resume();
  }catch(e){ diag('例外', e && e.message); }
  primeSpeech(GREETING, true, wayOf(S.speechWay));   /* 操作の中での発話＝ここで解錠される */

  var step=0;
  var timer=setInterval(function(){
    var ss2=null;
    try{ ss2=window.speechSynthesis; }catch(e2){}
    if(ss2 && ss2.speaking) speechReady=true;
    if(speechReady || strokes.length || ROW.length){ clearInterval(timer); return; }
    if(step>=LADDER.length){
      clearInterval(timer);
      diag('あきらめ','どの方法でも鳴りませんでした');
      showSoundWarn();
      return;
    }
    var way=LADDER[step++];
    pickVoice();                       /* 声の一覧が届いていれば選び直す */
    try{ if(ss2){ if(ss2.paused) ss2.resume(); ss2.cancel(); } }catch(e3){}
    diag('やり直し', way.name);
    speakWith(GREETING, way, false);
  }, 900);
}

/* 音が出ていないことを介助者に知らせる帯 */
function showSoundWarn(){ var el=$('soundWarn'); if(el) el.hidden=false; }
function hideSoundWarn(){ var el=$('soundWarn'); if(el) el.hidden=true; }

function sayChar(ch){ say(READ[ch]||ch); }
function shutUp(){ try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){} }

/* ---------- 効果音（耳で状態がわかるように） ---------- */
var AC=null, acSuspendTimer=null;
function tone(freq, dur, vol){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var d=dur||0.09;
    var o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.12, AC.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+d);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+d+0.02);
    /* 鳴らし終えたら止めておく。iOS では鳴りっぱなしの音が音声合成を黙らせることがある */
    if(acSuspendTimer) clearTimeout(acSuspendTimer);
    acSuspendTimer=setTimeout(quietAudio, (d+0.15)*1000);
  }catch(e){}
}
var SND={
  touch:function(){ if(S.touchTick) tone(1400,0.03,0.05); },  /* 指が触れた合図 */
  ok:   function(){ tone(880,0.06,0.10); },                   /* 1文字よめた */
  unsure:function(){ tone(560,0.07,0.08); setTimeout(function(){ tone(470,0.07,0.08); },70); },
  del:  function(){ tone(300,0.10,0.12); },
  fail: function(){ tone(220,0.14,0.12); },
  sent: function(){ tone(660,0.09,0.11); setTimeout(function(){ tone(990,0.12,0.11); },90); }
};

/* ---------- 覚えた字（本人の筆跡を覚えて認識に生かす） ----------
   認識時と同じ 48x48 の画像を 24x24 に縮めて指紋として保存する。
   ・候補ボタンで直したとき（設定ON）
   ・設定の「手書きを おぼえさせる」で書いたとき
   に貯まり、次からその字が出やすくなる。                         */
var IKEY='asacom2.ink', SIG=24, MAX_PER_CHAR=5, INK_VER=2;
var SIM_HIT=0.72, SIM_MARGIN=0.06;   /* ここまで似ていれば「本人のこの字」とみなす */
var INK=(function(){
  try{
    var o=JSON.parse(localStorage.getItem(IKEY)||'{}');
    if(!o || typeof o!=='object') return {};
    if(o.v!==undefined){ return (o.v===INK_VER && o.ink) ? o.ink : {}; }  /* 作り方が変わったら作り直し */
    return {};
  }catch(e){ return {}; }
})();
function saveInk(){ try{ localStorage.setItem(IKEY, JSON.stringify({v:INK_VER, ink:INK})); }catch(e){} }
function inkCount(){ var n=0; for(var k in INK) n+=INK[k].length; return n; }

function blurSig(a){
  var o=new Float32Array(a.length), x, y, dx, dy;
  for(y=0;y<SIG;y++) for(x=0;x<SIG;x++){
    var s=0, n=0;
    for(dy=-1;dy<=1;dy++) for(dx=-1;dx<=1;dx++){
      var yy=y+dy, xx=x+dx;
      if(yy<0||yy>=SIG||xx<0||xx>=SIG) continue;
      s+=a[yy*SIG+xx]; n++;
    }
    o[y*SIG+x]=s/n;
  }
  return o;
}
function signature(strokes){
  if(typeof CNN==='undefined' || !CNN.ready()) return null;
  var img=CNN.rasterize(strokes, penRatio(strokes));
  if(!img) return null;
  var S=48, k=S/SIG, raw=new Float32Array(SIG*SIG), x, y, dx, dy;
  for(y=0;y<SIG;y++) for(x=0;x<SIG;x++){
    var s=0;
    for(dy=0;dy<k;dy++) for(dx=0;dx<k;dx++) s+=img[(y*k+dy)*S + (x*k+dx)];
    raw[y*SIG+x]=Math.min(1, s/(k*k));
  }
  /* 少しぼかしてから比べる（位置が数ミリずれても同じ字と分かるように） */
  var b=blurSig(blurSig(raw)), out=new Uint8Array(SIG*SIG);
  for(var i=0;i<b.length;i++) out[i]=Math.round(b[i]*255);
  return out;
}
function sigToStr(u8){
  var s=''; for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]);
  try{ return btoa(s); }catch(e){ return null; }
}
function strToSig(str){
  try{
    var bin=atob(str), u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return u;
  }catch(e){ return null; }
}
/* 重なり具合（0〜1）。線の濃さをそのまま使う */
function similarity(a,b){
  var inter=0, uni=0;
  for(var i=0;i<a.length;i++){
    var x=a[i], y=b[i];
    inter += x<y?x:y;
    uni   += x>y?x:y;
  }
  return uni>0 ? inter/uni : 0;
}
function remember(ch, strokes){
  var sig=signature(strokes); if(!sig) return false;
  var str=sigToStr(sig); if(!str) return false;
  if(!INK[ch]) INK[ch]=[];
  INK[ch].push(str);
  while(INK[ch].length>MAX_PER_CHAR) INK[ch].shift();
  saveInk();
  return true;
}
/* 覚えた字と今の筆跡を見比べて、字ごとの後押し量を返す */
function inkBonus(strokes){
  if(!S.useInk) return null;
  var keys=Object.keys(INK);
  if(!keys.length) return null;
  var sig=signature(strokes); if(!sig) return null;
  var map={}, top={ch:null, sim:0}, second=0;
  for(var i=0;i<keys.length;i++){
    var list=INK[keys[i]], best=0;
    for(var j=0;j<list.length;j++){
      var other=strToSig(list[j]);
      if(!other || other.length!==sig.length) continue;
      var sim=similarity(sig, other);
      if(sim>best) best=sim;
    }
    if(best>top.sim){ second=top.sim; top={ch:keys[i], sim:best}; }
    else if(best>second) second=best;
    var b=(best-0.45)*1.6;                 /* 同じ字どうしは中央 0.59、違う字は中央 0.29 */
    if(b>0) map[keys[i]]=Math.min(0.45, b);
  }
  return {map:map, top:top, second:second};
}

/* ---------- 濁点・半濁点 ---------- */
var DAKU={カ:'ガ',キ:'ギ',ク:'グ',ケ:'ゲ',コ:'ゴ',サ:'ザ',シ:'ジ',ス:'ズ',セ:'ゼ',ソ:'ゾ',
  タ:'ダ',チ:'ヂ',ツ:'ヅ',テ:'デ',ト:'ド',ハ:'バ',ヒ:'ビ',フ:'ブ',ヘ:'ベ',ホ:'ボ',ウ:'ヴ'};
var HANDAKU={ハ:'パ',ヒ:'ピ',フ:'プ',ヘ:'ペ',ホ:'ポ'};
var UNDAKU={}, UNHAN={};
(function(){ for(var k in DAKU) UNDAKU[DAKU[k]]=k; for(var j in HANDAKU) UNHAN[HANDAKU[j]]=j; })();

/* ---------- 状態 ---------- */
var ROW=[];          /* {ch,score,low,ink,raw} */
var strokes=[];      /* いま書いている文字の筆跡 */
var ghost=null;      /* 即確定を取り消す可能性のある筆跡（表示のみ） */
var cur=null, activeId=null;
var gapTimer=null, candTimer=null, fadeReq=null;
var lastCommit=null; /* {at,instant} */
var lastHandaku=null;/* {at,index} 半濁点に変換した直後の情報 */
var avgFrac=0;       /* 本人の字の大きさ（書く面の短辺に対する比・指数移動平均）
                        画面の回転や表示の変化でキャンバスの大きさが変わってもずれないように、
                        px ではなく比で覚える */
var started=false;

var pad=$('pad'), padWrap=$('padWrap'), ctx=pad.getContext('2d');
var padW=0, padH=0, dpr=1;
function penWidth(){ return S.penWidth==='thin'?8:(S.penWidth==='thick'?16:12); }
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }

function sizePad(){
  var r=padWrap.getBoundingClientRect();
  if(!r.width || !r.height) return;
  dpr=Math.min(window.devicePixelRatio||1,3);
  padW=r.width; padH=r.height;
  pad.width=Math.round(padW*dpr); pad.height=Math.round(padH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}
function drawStrokes(list, alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=cssVar('--on-surface')||'#202124';
  ctx.lineWidth=penWidth(); ctx.lineCap='round'; ctx.lineJoin='round';
  for(var i=0;i<list.length;i++){
    var p=list[i]; if(!p || !p.length) continue;
    ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
    if(p.length===1) ctx.lineTo(p[0].x+0.1,p[0].y+0.1);
    for(var j=1;j<p.length;j++) ctx.lineTo(p[j].x,p[j].y);
    ctx.stroke();
  }
  ctx.restore();
}
function redraw(alpha){
  ctx.clearRect(0,0,padW,padH);
  if(S.guide!=='none'){
    ctx.save();
    ctx.strokeStyle=cssVar('--outline')||'#DADCE0';
    ctx.globalAlpha=.9; ctx.lineWidth=2; ctx.setLineDash([6,10]);
    ctx.beginPath();
    ctx.moveTo(padW/2,10); ctx.lineTo(padW/2,padH-10);
    ctx.moveTo(10,padH/2); ctx.lineTo(padW-10,padH/2);
    if(S.guide==='quarter'){
      ctx.moveTo(padW/4,10); ctx.lineTo(padW/4,padH-10);
      ctx.moveTo(padW*3/4,10); ctx.lineTo(padW*3/4,padH-10);
      ctx.moveTo(10,padH/4); ctx.lineTo(padW-10,padH/4);
      ctx.moveTo(10,padH*3/4); ctx.lineTo(padW-10,padH*3/4);
    }
    ctx.stroke(); ctx.restore();
  }
  if(ghost) drawStrokes(ghost, 0.35);
  drawStrokes(strokes, (alpha===undefined?1:alpha));
}
function fadeOutInk(){
  if(fadeReq) cancelAnimationFrame(fadeReq);
  var t0=performance.now();
  function step(t){
    var k=Math.min(1,(t-t0)/180);
    redraw(1-k);
    if(k<1) fadeReq=requestAnimationFrame(step);
    else { strokes=[]; fadeReq=null; redraw(); }
  }
  fadeReq=requestAnimationFrame(step);
}
function clearInk(){ if(fadeReq){ cancelAnimationFrame(fadeReq); fadeReq=null; } strokes=[]; redraw(); }

/* ---------- ポインタ（最初の1点のみ＝手のひら対策） ---------- */
pad.addEventListener('pointerdown', function(e){
  if(activeId!==null) return;
  e.preventDefault();
  activeId=e.pointerId;
  try{ pad.setPointerCapture(activeId); }catch(err){}
  /* 解錠は「指を離した時点」で行う（pointerdown では iOS が受け付けない） */
  if(gapTimer){ clearTimeout(gapTimer); gapTimer=null; }
  if(fadeReq){ cancelAnimationFrame(fadeReq); fadeReq=null; strokes=[]; }
  /* 即確定の直後なら、取り消せるよう筆跡を控えておく（判断は書き終わりに行う） */
  if(!ghost && lastCommit && lastCommit.instant && (Date.now()-lastCommit.at)<=RECOVER_MS && ROW.length){
    var it=ROW[ROW.length-1];
    if(it.raw && it.raw.length) ghost=it.raw;
  }
  SND.touch();
  var r=pad.getBoundingClientRect();
  cur=[{x:e.clientX-r.left, y:e.clientY-r.top}];
  strokes.push(cur);
  redraw();
});
pad.addEventListener('pointermove', function(e){
  if(e.pointerId!==activeId || !cur) return;
  e.preventDefault();
  var r=pad.getBoundingClientRect();
  var x=e.clientX-r.left, y=e.clientY-r.top;
  var l=cur[cur.length-1];
  if(Math.abs(x-l.x)+Math.abs(y-l.y)<1.2) return;
  cur.push({x:x,y:y});
  redraw();
});
pad.addEventListener('pointerup', function(e){
  if(e.pointerId!==activeId) return;
  activeId=null; cur=null;
  /* ここは「指を離した時点」＝音声を解錠できる場面 */
  if(!speechReady && S.speak) primeSpeech(null, false, wayOf(S.speechWay));
  onStrokeEnd();
});
pad.addEventListener('pointercancel', function(e){
  if(e.pointerId===activeId){ activeId=null; cur=null; }
});

/* ---------- 1画の書き終わり → 判定 ---------- */
function onStrokeEnd(){
  if(!strokes.length) return;
  /* おぼえさせるモード：認識せず、書き終わりを待って筆跡を覚える */
  if(teach){
    if(gapTimer) clearTimeout(gapTimer);
    gapTimer=setTimeout(resolveTeach, Math.max(S.strokeGapMs, 700)+200);
    return;
  }
  var cell=Math.min(padW,padH);
  var lastCh=ROW.length? ROW[ROW.length-1].ch : null;

  /* ① ジグザグ＝削除（最優先） */
  if(Recog.isZigzag([strokes[strokes.length-1]], cell, S.zigzag)){
    ghost=null;
    if(strokes.length>1){ clearInk(); say('削除'); SND.del(); return; }  /* 書きかけを破棄 */
    clearInk(); deleteChar(); return;
  }

  /* ② 小さく書かれた記号（濁点・半濁点・句点）
     2画そろった濁点はすぐ確定、点ひとつは「濁点の1画目」「ン・シの点」の
     可能性があるので、少し待ってから決める（DOT_WAIT） */
  var mark=Recog.markOf(strokes, cell, avgFrac*cell);
  if(mark==='daku' && lastCh && DAKU[lastCh]){
    ghost=null; clearInk(); applyDaku(); return;
  }
  if(mark==='dot'){
    if(gapTimer) clearTimeout(gapTimer);
    gapTimer=setTimeout(resolvePending, Math.max(S.strokeGapMs, 700)+200);
    return;
  }

  /* ③ 書き足しリカバリ（即確定を取り消して続きの画にする） */
  if(ghost){
    var merged=ghost.concat(strokes);
    var rg=Recog.recognize(merged, {useDigits:S.useDigits, digitsOnly:S.digitsOnly, kanaFirst:S.kanaFirst, penRatio:penRatio(strokes), ink:inkBonus(strokes)});
    var rs=Recog.recognize(strokes, {useDigits:S.useDigits, digitsOnly:S.digitsOnly, kanaFirst:S.kanaFirst, penRatio:penRatio(strokes), ink:inkBonus(strokes)});
    var gScore=rg.cands.length?rg.cands[0].score:0;
    var sScore=rs.cands.length?rs.cands[0].score:0;
    /* 続きとして読んだほうが自然なときだけ取り消す */
    if(gScore>=THRESH.accept[S.strictness] && gScore>sScore+0.05){
      ROW.pop(); shutUp(); lastCommit=null;
      strokes=merged; ghost=null;
      renderRow(); hideCands(); redraw();
    } else {
      ghost=null; redraw();
    }
  }

  /* ④ 文字認識 */
  var res=Recog.recognize(strokes, {useDigits:S.useDigits, digitsOnly:S.digitsOnly, kanaFirst:S.kanaFirst, penRatio:penRatio(strokes), ink:inkBonus(strokes)});
  var best=res.cands[0];
  if(S.fastCommit && best && !res.continuable
     && best.score>=THRESH.instant[S.strictness]){
    commitChar(res, true); return;
  }
  if(gapTimer) clearTimeout(gapTimer);
  gapTimer=setTimeout(resolvePending, S.strokeGapMs);
}

/* 待ち時間が過ぎた：記号か文字かを最終判断する */
function resolvePending(){
  gapTimer=null;
  if(!strokes.length) return;
  var cell=Math.min(padW,padH);
  var lastCh=ROW.length? ROW[ROW.length-1].ch : null;
  var mark=Recog.markOf(strokes, cell, avgFrac*cell);
  if(mark==='daku' && lastCh && DAKU[lastCh]){ ghost=null; clearInk(); applyDaku(); return; }
  if(mark==='dot'){ handleDot(); return; }
  var r2=Recog.recognize(strokes, {useDigits:S.useDigits, digitsOnly:S.digitsOnly, kanaFirst:S.kanaFirst, penRatio:penRatio(strokes), ink:inkBonus(strokes)});
  /* 「いちばん近い字にする」が ON なら、自信が低くても必ずどれかに決める
     （自信の低い字はオレンジの下線付きで表示し、候補ボタンで直せる） */
  if(r2.cands.length && (S.alwaysGuess || r2.cands[0].score>=THRESH.accept[S.strictness]))
    commitChar(r2, false);
  else failRecognize();
}

/* 小さな丸ひとつ＝「。」または半濁点 */
function handleDot(){
  ghost=null; clearInk();
  var lastCh=ROW.length? ROW[ROW.length-1].ch : null;
  /* 半濁点にしてしまった直後にもう一度丸 → 「。」のつもりだったと解釈して戻す */
  if(lastHandaku && (Date.now()-lastHandaku.at)<UNDO_HAN_MS && ROW.length>lastHandaku.index){
    var it=ROW[lastHandaku.index];
    if(UNHAN[it.ch]) it.ch=UNHAN[it.ch];
    lastHandaku=null; renderRow(); endSentence(); return;
  }
  if(lastCh && HANDAKU[lastCh]){ applyHandaku(); return; }
  endSentence();
}

function failRecognize(){
  clearInk(); ghost=null;
  padWrap.classList.add('shake');
  setTimeout(function(){ padWrap.classList.remove('shake'); }, 260);
  showHint('認識できません');
  SND.fail();
  if(S.sayFail) say('認識できません。', {force:true});
}

/* CNN に渡す「線の太さ ÷ 字の大きさ」。学習時と同じ見え方に近づけるため */
function penRatio(list){
  var sz=strokesSize(list);
  return sz>0 ? penWidth()/sz : 0.09;
}

function strokesSize(list){
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(var i=0;i<list.length;i++) for(var j=0;j<list[i].length;j++){
    var p=list[i][j];
    if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
    if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
  }
  return Math.max(maxX-minX, maxY-minY);
}

function commitChar(res, instant){
  var best=res.cands[0];
  var low = best.score < THRESH.low[S.strictness];
  ROW.push({
    ch:best.ch, score:best.score, low:low,
    ink:Recog.inkOf(strokes),
    raw:strokes.map(function(s){ return s.map(function(p){ return {x:p.x,y:p.y}; }); })
  });
  /* 本人の字の大きさを覚える（記号判定のものさしにする） */
  var cell0=Math.min(padW,padH), sz=strokesSize(strokes);
  if(sz>0 && cell0>0){
    var f=sz/cell0;
    avgFrac = avgFrac ? (avgFrac*0.7+f*0.3) : f;
  }
  renderRow(true);
  sayChar(best.ch);
  if(low) SND.unsure(); else SND.ok();
  lastCommit={at:Date.now(), instant:!!instant};
  lastHandaku=null;
  showCands(res.cands.slice(1));
  fadeOutInk();
}

/* ---------- 濁点・半濁点の適用 ---------- */
function applyDaku(){
  var it=ROW[ROW.length-1];
  var n=DAKU[it.ch]; if(!n) return;
  it.ch=n; it.low=false; lastCommit=null; lastHandaku=null;
  renderRow(true); sayChar(n); SND.ok(); hideCands();
}
function applyHandaku(){
  var it=ROW[ROW.length-1];
  var n=HANDAKU[it.ch]; if(!n) return;
  it.ch=n; it.low=false; lastCommit=null;
  lastHandaku={at:Date.now(), index:ROW.length-1};
  renderRow(true); sayChar(n); SND.ok(); hideCands();
}

/* ---------- おぼえさせるモード ---------- */
var teach=null;   /* {ch:'ア', left:3, done:0} */
var TEACH_TIMES=3;

function startTeach(ch){
  teach={ch:ch, left:TEACH_TIMES, done:0};
  closeSheet(); hideCands(); clearInk();
  updateTeachBar();
  say(ch+' を '+TEACH_TIMES+'かい かいて ください。', {force:true});
}
function stopTeach(quiet){
  var t=teach; teach=null;
  $('teachBar').hidden=true;
  clearInk();
  if(!quiet && t && t.done){ say(t.ch+' を おぼえました。', {force:true}); SND.sent(); }
  buildSheet();
}
function updateTeachBar(){
  if(!teach){ $('teachBar').hidden=true; return; }
  $('teachBar').hidden=false;
  $('teachMsg').textContent='「'+teach.ch+'」を かいて ください（のこり '+teach.left+' かい）';
}
function resolveTeach(){
  gapTimer=null;
  if(!teach || !strokes.length) return;
  var ok=remember(teach.ch, strokes);
  fadeOutInk();
  if(!ok){ say('うまく おぼえられません でした。', {force:true}); SND.fail(); return; }
  teach.done++; teach.left--;
  SND.ok();
  if(teach.left<=0){ stopTeach(); return; }
  updateTeachBar();
  say(teach.done+'つめ。もういちど。', {force:true});
}
$('teachStop').addEventListener('click', function(){ stopTeach(true); });

/* ---------- 入力中の行 ---------- */
function inkSvg(ink){
  var out='<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">';
  for(var i=0;i<ink.length;i++){
    var a=ink[i], pts=[];
    for(var j=0;j<a.length;j+=2) pts.push((a[j]*100).toFixed(1)+','+(a[j+1]*100).toFixed(1));
    out+='<polyline points="'+pts.join(' ')+'"/>';
  }
  return out+'</svg>';
}
function renderRow(highlightLast){
  var box=$('cells');
  box.innerHTML='';
  for(var i=0;i<ROW.length;i++){
    var it=ROW[i];
    var d=document.createElement('div');
    d.className='cell'+(it.low?' low':'');
    d.setAttribute('aria-label', it.ch);
    d.innerHTML=(it.ink? inkSvg(it.ink) : '<div class="glyph">'+it.ch+'</div>')
               +'<div class="ch">'+it.ch+'</div>';
    box.appendChild(d);
  }
  $('rowEmpty').style.display=ROW.length?'none':'block';
  $('cellsWrap').style.display=ROW.length?'flex':'none';
  $('cellsWrap').scrollLeft=1e6;
  if(highlightLast && box.lastChild){
    var el=box.lastChild;
    el.classList.add('hi');
    setTimeout(function(){ try{ el.classList.remove('hi'); }catch(e){} }, 600);
  }
  updateKeys();
}
function updateKeys(){
  var last=ROW.length? ROW[ROW.length-1].ch : null;
  $('kDaku').disabled=!(last && (DAKU[last]||UNDAKU[last]));
  $('kHan').disabled =!(last && (HANDAKU[last]||UNHAN[last]));
  $('kDel').disabled =!ROW.length;
  $('kRead').disabled=!ROW.length;
  $('kPeriod').disabled=!ROW.length;
}
function rowText(){ var t=''; for(var i=0;i<ROW.length;i++) t+=ROW[i].ch; return t; }

/* ---------- 候補チップ（介助者が見て直すためのもの） ---------- */
function showCands(list){
  var box=$('cands');
  box.innerHTML='';
  if(!S.candidateMs || !list || !list.length) return;
  for(var i=0;i<list.length && i<2;i++){
    (function(c){
      var b=document.createElement('button');
      b.className='chip';
      b.innerHTML=c.ch+' <small>にする</small>';
      b.addEventListener('click', function(){ replaceLast(c.ch); });
      box.appendChild(b);
    })(list[i]);
  }
  if(candTimer) clearTimeout(candTimer);
  candTimer=setTimeout(hideCands, S.candidateMs);
}
function hideCands(){ $('cands').innerHTML=''; if(candTimer){ clearTimeout(candTimer); candTimer=null; } }
function replaceLast(ch){
  if(!ROW.length) return;
  /* 直した＝その筆跡が本当はその字だった、ということなので覚える */
  var it0=ROW[ROW.length-1];
  if(S.learnOnFix && it0.raw && it0.raw.length) remember(ch, it0.raw);
  ROW[ROW.length-1].ch=ch; ROW[ROW.length-1].low=false;
  lastCommit=null; lastHandaku=null;
  renderRow(true); sayChar(ch); hideCands();
}

/* ---------- 削除 ---------- */
function deleteChar(){
  hideCands();
  if(!ROW.length){
    if(S.sayEmptyDelete) say('けすものが ありません。', {force:true});
    SND.fail(); return;
  }
  var box=$('cells'), el=box.lastChild;
  ROW.pop(); lastCommit=null; lastHandaku=null;
  say('削除', {force:true}); SND.del();
  if(el){ el.classList.add('del'); setTimeout(function(){ renderRow(); }, 300); }
  else renderRow();
  updateKeys();
}

/* ---------- 文の確定（「。」） ---------- */
function endSentence(){
  hideCands();
  if(!ROW.length){ say('まだ なにも かいて いません。', {force:true}); SND.fail(); return; }
  var text=rowText()+'。';
  SND.sent();
  say(text, {force:true});
  addLog(text);
  ROW=[]; lastCommit=null; lastHandaku=null;
  renderRow();
}

/* ---------- ログ ---------- */
function nowParts(){
  var d=new Date();
  function p(n){ return (n<10?'0':'')+n; }
  var off=-d.getTimezoneOffset(), sign=off>=0?'+':'-'; off=Math.abs(off);
  return {
    iso:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())
        +sign+p(Math.floor(off/60))+':'+p(off%60),
    date:d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()),
    time:p(d.getHours())+':'+p(d.getMinutes())
  };
}
function addLog(text){
  if(!S.logEnabled) return;
  var n=nowParts();
  var e={id:Math.random().toString(36).slice(2,8), datetime:n.iso, date:n.date, time:n.time, type:'text', text:text};
  LOG.push(e); saveLog(); appendLogItem(e, true);
}
function logItemEl(e){
  var d=document.createElement('div'); d.className='logItem';
  var t=document.createElement('div'); t.className='t'; t.textContent=e.time;
  var b=document.createElement('div'); b.className='b'; b.textContent=e.text;
  d.appendChild(t); d.appendChild(b); return d;
}
function appendLogItem(e, scroll){
  var box=$('log'), prev=LOG[LOG.length-2];
  if(!prev || prev.date!==e.date){
    var h=document.createElement('div'); h.className='logDate';
    h.innerHTML='<span>'+e.date+'</span>'; box.appendChild(h);
  }
  box.appendChild(logItemEl(e));
  if(scroll) box.scrollTop=box.scrollHeight;
}
function renderLog(){
  var box=$('log'); box.innerHTML='';
  var list=LOG.slice(-200), lastDate=null;
  for(var i=0;i<list.length;i++){
    if(list[i].date!==lastDate){
      lastDate=list[i].date;
      var h=document.createElement('div'); h.className='logDate';
      h.innerHTML='<span>'+lastDate+'</span>'; box.appendChild(h);
    }
    box.appendChild(logItemEl(list[i]));
  }
  box.scrollTop=box.scrollHeight;
}
function exportCsv(){
  var rows=['datetime,time,type,text'];
  for(var i=0;i<LOG.length;i++){
    var e=LOG[i];
    rows.push([e.datetime,e.time,e.type,'"'+String(e.text).replace(/"/g,'""')+'"'].join(','));
  }
  var blob=new Blob(['﻿'+rows.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='asacom2_log_'+nowParts().date.replace(/-/g,'')+'.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('ログを書き出しました');
}
/* 覚えた字の持ち出し／読み込み（別のiPadへ移す、開発側で精度改善に使う、など） */
function exportInk(){
  var data={app:'Asa-Com2', kind:'ink', size:SIG, saved:nowParts().iso, ink:INK};
  var blob=new Blob([JSON.stringify(data)], {type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='asacom2_ink_'+nowParts().date.replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('おぼえた字を書き出しました（'+inkCount()+'個）');
}
function importInk(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.addEventListener('change', function(){
    var f=inp.files && inp.files[0];
    if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d || d.kind!=='ink' || !d.ink) throw 0;
        var add=0;
        for(var ch in d.ink){
          if(!INK[ch]) INK[ch]=[];
          for(var i=0;i<d.ink[ch].length;i++){
            INK[ch].push(d.ink[ch][i]); add++;
          }
          while(INK[ch].length>MAX_PER_CHAR) INK[ch].shift();
        }
        saveInk(); buildSheet(); toast(add+'個 読み込みました');
      }catch(e){ toast('読み込めませんでした'); }
    };
    rd.readAsText(f);
  });
  inp.click();
}

function clearLog(){
  if(!confirm('ログをすべて消します。よろしいですか？')) return;
  LOG.length=0;
  try{ localStorage.removeItem(LKEY); }catch(e){}
  renderLog(); toast('ログを消しました');
}

/* 設定：手書きを おぼえさせる（「覚えさせる」セクションの下に出す） */
function appendTeach(body){
  /* おぼえさせる：文字えらび */
  var th=document.createElement('div'); th.className='sec'; th.textContent='手書きを おぼえさせる';
  body.appendChild(th);
  var note=document.createElement('div'); note.className='item';
  note.innerHTML='<div class="lb">よく まちがえる字を えらぶと、その字を '+TEACH_TIMES+'回 書いてもらいます'
    +'<small>いま おぼえている字：'+inkCount()+'個</small></div>';
  body.appendChild(note);
  var pick=document.createElement('div'); pick.id='teachPick';
  var CHARS=(typeof CNN!=='undefined' && CNN.ready()) ? CNN.classes() : [];
  CHARS.forEach(function(ch){
    var b=document.createElement('button');
    b.textContent=ch;
    if(INK[ch] && INK[ch].length) b.className='has';
    b.addEventListener('click', function(){ startTeach(ch); });
    pick.appendChild(b);
  });
  body.appendChild(pick);
  var be=document.createElement('button'); be.className='act'; be.textContent='おぼえた字を 書き出す';
  be.addEventListener('click', exportInk);
  body.appendChild(be);
  var bi=document.createElement('button'); bi.className='act'; bi.textContent='おぼえた字を 読み込む';
  bi.addEventListener('click', importInk);
  body.appendChild(bi);

  var bc=document.createElement('button'); bc.className='act danger'; bc.textContent='おぼえた字を 消す';
  bc.addEventListener('click', function(){
    if(!confirm('おぼえた字をすべて消します。よろしいですか？')) return;
    INK={}; saveInk(); buildSheet(); toast('おぼえた字を消しました');
  });
  body.appendChild(bc);
}

function buildSheet(){
  var body=$('sheetBody'); body.innerHTML='';
  SECTIONS.forEach(function(sec){
    var h=document.createElement('div'); h.className='sec'; h.textContent=sec.t; body.appendChild(h);
    sec.items.forEach(function(it){
      var row=document.createElement('div'); row.className='item';
      var lb=document.createElement('div'); lb.className='lb';
      lb.innerHTML=it.l+(it.s?'<small>'+it.s+'</small>':'');
      row.appendChild(lb);
      if(it.sw){
        var sw=document.createElement('div');
        sw.className='sw'+(S[it.k]?' on':'');
        sw.setAttribute('role','switch');
        sw.setAttribute('aria-checked', S[it.k]?'true':'false');
        sw.addEventListener('click', function(){
          S[it.k]=!S[it.k]; saveSettings(); applySettings(); buildSheet();
        });
        row.appendChild(sw);
      } else if(it.voice){
        var sel=document.createElement('select'); sel.id='voiceSel';
        sel.addEventListener('change', function(){
          S.voiceURI=sel.value||null; saveSettings(); pickVoice();
          say('こんにちは。あさちゃん。', {force:true});
        });
        row.appendChild(sel);
      } else {
        var s2=document.createElement('select');
        it.o.forEach(function(pair){
          var op=document.createElement('option');
          op.value=String(pair[0]); op.textContent=pair[1];
          if(String(S[it.k])===String(pair[0])) op.selected=true;
          s2.appendChild(op);
        });
        s2.addEventListener('change', function(){
          var v=s2.value;
          S[it.k]=(v==='true')?true:(v==='false')?false:(isNaN(Number(v))?v:Number(v));
          saveSettings(); applySettings(); buildSheet();
        });
        row.appendChild(s2);
      }
      body.appendChild(row);
    });
    if(sec.after==='teach') appendTeach(body);   /* 「覚えさせる」の3項目の下に置く */
  });
  var b1=document.createElement('button'); b1.className='act'; b1.textContent='設定を初期値にもどす';
  b1.addEventListener('click', function(){
    if(!confirm('設定を初期値にもどします。よろしいですか？（ログと おぼえた字は消えません）')) return;
    for(var k in DEF) S[k]=DEF[k];
    saveSettings(); applySettings(); buildSheet(); toast('設定をもどしました');
  });
  var b2=document.createElement('button'); b2.className='act'; b2.textContent='ログを書き出す（CSV）';
  b2.addEventListener('click', exportCsv);
  var b3=document.createElement('button'); b3.className='act danger'; b3.textContent='ログを消去';
  b3.addEventListener('click', clearLog);
  body.appendChild(b1); body.appendChild(b2); body.appendChild(b3);
  renderVoiceOptions();
}
function renderVoiceOptions(){
  var sel=document.getElementById('voiceSel');
  if(!sel) return;
  sel.innerHTML='';
  var auto=document.createElement('option');
  auto.value=''; auto.textContent='自動（女性優先）';
  sel.appendChild(auto);
  VOICES.forEach(function(v){
    var op=document.createElement('option');
    op.value=v.voiceURI; op.textContent=v.name;
    if(S.voiceURI===v.voiceURI) op.selected=true;
    sel.appendChild(op);
  });
}
/* 音まわりの状態をまとめた文章（画面には出さない。不具合を追うときに使う） */
function diagText(){
  var ss=null;
  try{ ss=window.speechSynthesis; }catch(e){}
  var vs=[];
  try{ vs=(ss && ss.getVoices ? ss.getVoices() : [])||[]; }catch(e2){}
  var ja=vs.filter(function(v){ return /^ja/i.test(v.lang||''); });
  var lines=[];
  lines.push('Asa-Com2 音の状態  更新 '+BUILD);
  lines.push('音声合成に対応：'+(('speechSynthesis' in window)?'はい':'いいえ'));
  lines.push('声の数：'+vs.length+'（日本語 '+ja.length+'）');
  lines.push('日本語の声：'+(ja.map(function(v){return v.name;}).join(' / ')||'なし'));
  lines.push('選んでいる声：'+(theVoice?theVoice.name:'（指定なし）'));
  if(ss) lines.push('いまの状態：speaking='+ss.speaking+' pending='+ss.pending+' paused='+ss.paused);
  lines.push('効果音（WebAudio）：'+(AC?AC.state:'まだ使っていない'));
  lines.push('鳴った実績：'+(speechReady?('あり（'+(DIAG.worked||'—')+'）'):'まだ無い'));
  lines.push('最後のエラー：'+(DIAG.lastError||'なし'));
  lines.push('読み上げ設定：'+(S.speak?'ON':'OFF')+'／効果音：'+(S.sound?'ON':'OFF'));
  lines.push('できごと（新しい順）：');
  for(var i=DIAG.events.length-1, n=0; i>=0 && n<12; i--, n++){
    var e=DIAG.events[i];
    var t=e.t, hh=('0'+t.getHours()).slice(-2), mm=('0'+t.getMinutes()).slice(-2), sc=('0'+t.getSeconds()).slice(-2);
    lines.push('  '+hh+':'+mm+':'+sc+'  '+e.kind+'  '+e.detail);
  }
  return lines.join('\n');
}
$('soundWarnTest').addEventListener('click', function(){
  speechReady=false;
  var way=wayOf(S.speechWay);
  speakWith('テスト。きこえますか。', way, true);
  setTimeout(function(){
    if(!speechReady){
      var next=LADDER[(way.id+1)%LADDER.length];
      speakWith('テスト。きこえますか。', next, true);
    }
  }, 900);
});
$('soundWarnClose').addEventListener('click', hideSoundWarn);

function openSheet(){ $('sheet').classList.add('on'); $('scrim').classList.add('on'); buildSheet(); }
function closeSheet(){ $('sheet').classList.remove('on'); $('scrim').classList.remove('on'); }
$('closeSheet').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
(function(){
  var t=null, fired=false;
  $('gear').addEventListener('pointerdown', function(){
    fired=false;
    if(!S.gearGuard) return;
    t=setTimeout(function(){ fired=true; openSheet(); }, 1000);
  });
  $('gear').addEventListener('pointerup', function(){ if(t){ clearTimeout(t); t=null; } });
  $('gear').addEventListener('pointerleave', function(){ if(t){ clearTimeout(t); t=null; } });
  $('gear').addEventListener('click', function(){
    if(S.gearGuard){ if(!fired) toast('設定は1秒ながおしで開きます'); return; }
    openSheet();
  });
})();

/* ---------- 設定の反映 ---------- */
var wakeLock=null;
function applyWakeLock(){
  if(!('wakeLock' in navigator)) return;
  if(S.keepAwake && !wakeLock){
    navigator.wakeLock.request('screen').then(function(l){
      wakeLock=l;
      l.addEventListener('release', function(){ wakeLock=null; });
    }).catch(function(){});
  } else if(!S.keepAwake && wakeLock){
    try{ wakeLock.release(); }catch(e){}
    wakeLock=null;
  }
}
function applySettings(){
  document.body.classList.toggle('hc', !!S.highContrast);
  document.body.classList.toggle('noKeys', !S.showKeys);
  document.body.classList.toggle('logHidden', S.logRatio==='hidden');
  var fs=S.fontScale==='large'?1.18:(S.fontScale==='xlarge'?1.36:1);
  document.documentElement.style.setProperty('--font-scale', fs);
  var split=S.logRatio==='narrow'?'3fr 1fr':(S.logRatio==='wide'?'3fr 2fr':'5fr 2fr');
  document.documentElement.style.setProperty('--split', split);
  updateToggles(); applyWakeLock(); sizePad(); renderRow();
}

/* テスト用の窓口（自動テストから中の値を確かめるため。通常の動作には影響しない） */
window.__asacom2={ inkBonus:inkBonus, ink:function(){ return INK; }, settings:function(){ return S; },
                   diag:function(){ return diagText(); },
                   state:function(){ return {avgFrac:avgFrac, avgSize:avgFrac*Math.min(padW,padH), padW:padW, padH:padH,
                                             strokes:strokes.length, row:ROW.map(function(r){return r.ch;}),
                                             speechReady:speechReady}; } };

/* ---------- 起動 ---------- */
function boot(){
  showBuild();
  applySettings(); renderLog(); renderRow();
  var st=$('start');
  function go(){
    if(started) return;
    started=true;
    st.classList.add('off');
    /* ここはユーザー操作の中。読み上げを OFF→ON してから挨拶する（iOSの制限への対処） */
    bootSpeech();
    /* ここでは AudioContext を作らない（効果音が音声合成を黙らせることがあるため。
       効果音は最初に必要になった時点で用意し、鳴り終えたら止める） */
    applyWakeLock(); sizePad();
    /* 立ち上げがうまくいけば帯は出ない。どの方法でも鳴らなかったときだけ出す */
    setTimeout(function(){ if(!speechReady && S.speak) showSoundWarn(); }, 9000);
  }
  /* iPadOS は「指を触れた瞬間（pointerdown）」では音声合成を解錠しない。
     指を離した時点＝click／touchend でのみ解錠されるため、そこで立ち上げる。
     （実機で「🔊トグル」「音を出してみる」＝どちらもボタンのクリックだけが効いた） */
  st.addEventListener('click', go);
  st.addEventListener('touchend', function(e){ e.preventDefault(); go(); }, {passive:false});
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState!=='visible') return;
    applyWakeLock();
    try{ if('speechSynthesis' in window && window.speechSynthesis.paused) window.speechSynthesis.resume(); }catch(e){}
  });
}
window.addEventListener('resize', sizePad);
window.addEventListener('orientationchange', function(){ setTimeout(sizePad, 300); });
if(window.ResizeObserver) new ResizeObserver(sizePad).observe(padWrap);
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

boot();
})();
</script>
