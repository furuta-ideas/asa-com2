<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Asa-Com2">
<meta name="theme-color" content="#FAF7F0">
<meta name="format-detection" content="telephone=no">
<title>あさちゃんコミュニケーションボード Asa-Com2</title>

<!-- ホーム画面に追加したときのアイコン（iPad / iPhone の Safari が使う） -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--paper:#fff;--panel:#F1F3F4;--ink:#202124;--muted:#5F6368;--line:#DADCE0;--blue:#1A73E8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--paper);color:var(--ink);touch-action:manipulation;overscroll-behavior:none}
body.hc{--paper:#000;--panel:#111;--ink:#fff;--muted:#eee;--line:#fff;--blue:#8AB4F8}
button,select,input{font:inherit}
button{color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:12px;min-height:56px;padding:4px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0}#build{font-size:12px;color:var(--muted)}
#gear{margin-left:auto;min-width:48px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
#main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,5fr) minmax(160px,3fr)}
#left{min-height:0;min-width:0;display:flex;flex-direction:column;padding:12px;gap:8px}
#row{display:flex;align-items:center;gap:8px;flex:0 0 auto;border-bottom:1px solid var(--line);padding-bottom:8px}
#cellsWrap{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
#cells{display:flex;gap:8px;align-items:center;min-height:clamp(52px,12vh,96px)}
.cell{flex:0 0 auto;width:clamp(52px,12vh,96px);height:clamp(52px,12vh,96px);border:1px solid var(--line);border-radius:10px;padding:4px}
.cell svg{display:block;width:100%;height:100%}
#rowEmpty{font-size:14px;color:var(--muted);white-space:nowrap}
#deleteChar{flex:0 0 auto;min-height:44px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:12px}
.caption{margin:0;font-size:15px;color:var(--muted)}
#padWrap{position:relative;flex:1;min-height:0;border:3px solid var(--line);border-radius:18px;overflow:hidden}
#pad{display:block;width:100%;height:100%;touch-action:none}
#padWrap::before,#padWrap::after{content:"";position:absolute;z-index:1;pointer-events:none}
#padWrap::before{left:50%;top:10px;bottom:10px;border-left:2px dashed var(--line)}
#padWrap::after{top:50%;left:10px;right:10px;border-top:2px dashed var(--line)}
#padWrap.noGuide::before,#padWrap.noGuide::after{display:none}
#padWrap.quarter{background-image:linear-gradient(to right,transparent calc(25% - 1px),var(--line) 25%,transparent calc(25% + 1px),transparent calc(75% - 1px),var(--line) 75%,transparent calc(75% + 1px)),linear-gradient(to bottom,transparent calc(25% - 1px),var(--line) 25%,transparent calc(25% + 1px),transparent calc(75% - 1px),var(--line) 75%,transparent calc(75% + 1px))}
#side{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
#side h2{margin:0;padding:12px;font-size:18px;border-bottom:1px solid var(--line)}
#log{flex:1;min-height:0;overflow:auto;padding:12px;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch}
.logDate{font-size:12px;color:var(--muted);margin:6px 0 10px}
.logEntries{display:flex;align-items:flex-start;flex-wrap:wrap;gap:10px}
.logItem{flex:0 0 auto;max-width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.logItem .t{font-size:11px;color:var(--muted);margin-top:6px}
.logItem svg{display:block;width:100%;height:auto;color:var(--ink)}
.logItem .b{white-space:pre-wrap;overflow-wrap:anywhere}
.logItem.sentence{width:100%}
.sentenceInk{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.sentenceInk svg{flex:0 0 64px;width:64px;height:76px;max-width:100%}
#emptyLog{color:var(--muted);font-size:15px}
#actions{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--line);background:var(--paper)}
#actions button{min-height:60px;padding:10px 20px;border:2px solid var(--line);border-radius:16px;background:var(--paper);font-weight:600}
#actions #confirmInk{flex:1;background:var(--blue);border-color:var(--blue);color:#fff;font-size:26px}
body.hc #actions #confirmInk{color:#000}
#status{margin:0;padding:6px 16px;min-height:30px;color:var(--muted);font-size:14px}
#sheet{position:fixed;inset:0 0 0 auto;width:min(460px,100%);z-index:10;background:var(--paper);padding:20px;overflow:auto;box-shadow:0 0 0 100vmax #0006}
#sheet[hidden],#start.off{display:none}
#sheet h2{margin-top:0}#sheet label{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0}
#sheet button{display:block;width:100%;min-height:48px;margin:12px 0;background:var(--paper);border:2px solid var(--line);border-radius:12px}
#sheet input{width:24px;height:24px}#sheet select{padding:8px;background:var(--paper);color:var(--ink)}
#start{position:fixed;inset:0;z-index:20;border:0;width:100%;overflow:auto;background:var(--paper);color:var(--ink);padding:24px;display:grid;place-items:center;text-align:center}
#start h2{font-size:28px}#guide{max-width:600px;text-align:left;line-height:1.9;font-size:19px}#buildStart{font-size:13px;color:var(--muted)}
@media(max-width:600px){header{gap:8px;padding:4px 10px}header h1{font-size:17px}#build{font-size:10px}#main{grid-template-columns:minmax(0,1fr) minmax(120px,.8fr)}#left{padding:8px}.caption{font-size:12px}#side h2{font-size:15px;padding:10px}#log{padding:8px}#actions{gap:6px;padding:8px}#actions button{padding:8px;font-size:13px}#actions #confirmInk{font-size:23px}}
@media(max-height:500px){header{min-height:44px}#actions button{min-height:48px}#actions{padding:6px 12px}#status{padding:2px 12px;min-height:22px;font-size:12px}.caption{font-size:12px}#left{padding:6px 10px;gap:4px}}
@media(max-height:500px){#row{padding-bottom:4px}#cells{min-height:44px}.cell{width:44px;height:44px}#actions button{padding:6px 14px}#actions #confirmInk{font-size:22px}}
</style>
</head>
<body>
<div id="app">
  <header><h1>Asa-Com2</h1><span id="build"></span><button id="gear" type="button" aria-label="設定">⚙ 設定</button></header>
  <main id="main">
    <section id="left" aria-label="手書き入力">
      <div id="row" aria-label="文章を作成中"><div id="cellsWrap"><div id="cells"><span id="rowEmpty">ここに 手書きの文字が ならびます</span></div></div><button id="deleteChar" type="button" disabled>一文字けす</button></div>
      <p class="caption">一文字ずつ書いてください。文章ができたら下の「確定」</p>
      <div id="padWrap"><canvas id="pad" aria-label="手書きする場所"></canvas></div>
    </section>
    <aside id="side" aria-label="確定した手書き">
      <h2>確定した手書き</h2>
      <div id="log" role="log" aria-label="手書きの記録"><p id="emptyLog">確定した手書きがここに並びます</p></div>
    </aside>
  </main>
  <p id="status" role="status" aria-live="polite">文字認識は行いません。筆跡をそのまま記録します。</p>
  <footer id="actions">
    <button id="undoInk" type="button" disabled>一画もどす</button>
    <button id="clearInk" type="button" disabled>書き直す</button>
    <button id="confirmInk" type="button" disabled>確定</button>
  </footer>
</div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <h2 id="settingsTitle">設定</h2><button id="closeSheet" type="button">とじる</button>
  <label>線の太さ<select id="penWidth"><option value="8">細い</option><option value="12">ふつう</option><option value="16">太い</option></select></label>
  <label>書き足し待ち時間<select id="strokeGapMs"><option value="200">200ms</option><option value="300">300ms</option><option value="400">400ms（標準）</option><option value="600">600ms</option><option value="800">800ms</option><option value="1000">1000ms</option></select></label>
  <label>マス目ガイド<select id="guideLines"><option value="cross">十字</option><option value="quarter">十字＋四分割</option><option value="none">なし</option></select></label>
  <label>ハイコントラスト<input id="highContrast" type="checkbox"></label>
  <label>操作を声で知らせる<input id="speak" type="checkbox"></label>
  <p>手書きの内容は読み上げません。「確定しました」など操作だけをお知らせします。</p>
  <button id="exportLog" type="button">記録を書き出す（JSON）</button>
  <button id="clearLog" type="button">記録をすべて消す</button>
</section>
<button id="start" type="button"><div><h2>Asa-Com2 手書きボード</h2><div id="guide">
  ① 左の面に、一文字ずつ書きます。<br>
  ② 書き終えて少し待つと、上段に筆跡が並びます。<br>
  ③ 文章ができたら下の「確定」を押します。<br>
  上段の文字が右側へ移ります。文字認識は行いません。
  </div><p>ここをタッチして はじめる</p><p id="buildStart"></p></div></button>
<script>
(function(){
'use strict';
var BUILD='2026-11-15 19:40';  /* ==BUILD== */
function $(id){return document.getElementById(id);}
var LKEY='asacom2.log', SKEY='asacom2.manual.settings';
var S={penWidth:12,highContrast:false,speak:true,strokeGapMs:400,guideLines:'cross'}, LOG=[], ROW=[], strokes=[], activeId=null, current=null,logReadFailed=false,gapTimer=null;
var pad=$('pad'), ctx=pad.getContext('2d'), padW=0,padH=0,spaceW=0,spaceH=0,inkScale=1;
try{Object.assign(S,JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch(e){}
try{var legacy=JSON.parse(localStorage.getItem('asacom2.settings')||'{}');if(!Object.prototype.hasOwnProperty.call(JSON.parse(localStorage.getItem(SKEY)||'{}'),'strokeGapMs')&&[200,300,400,600,800,1000].indexOf(legacy.strokeGapMs)>=0)S.strokeGapMs=legacy.strokeGapMs;}catch(e){}
if([8,12,16].indexOf(S.penWidth)<0) S.penWidth=12;
if([200,300,400,600,800,1000].indexOf(S.strokeGapMs)<0)S.strokeGapMs=400;
if(['cross','quarter','none'].indexOf(S.guideLines)<0)S.guideLines='cross';
try{var saved=JSON.parse(localStorage.getItem(LKEY)||'[]');if(!Array.isArray(saved))throw new Error('Invalid log');LOG=saved;}catch(e){logReadFailed=true;status('保存した記録を読み込めませんでした。記録を書き出してからご確認ください。');}
function status(message){$('status').textContent=message;}
function say(message){
  if(!S.speak || !('speechSynthesis' in window)) return;
  try{window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(message);u.lang='ja-JP';window.speechSynthesis.speak(u);}catch(e){}
}
function controls(){
  var busy=activeId!==null, empty=!strokes.length;
  $('confirmInk').disabled=busy||(empty&&!ROW.length);$('undoInk').disabled=busy||empty;$('clearInk').disabled=busy||empty;$('deleteChar').disabled=busy||!ROW.length;
}
// Resize the view, never the stored strokes. Repeated rotations preserve the original ink.
function sizePad(){
  var r=pad.getBoundingClientRect();if(!r.width||!r.height)return;
  padW=r.width;padH=r.height;
  if(!strokes.length){spaceW=padW;spaceH=padH;}
  inkScale=Math.min(padW/spaceW,padH/spaceH);
  var dpr=Math.min(window.devicePixelRatio||1,3);
  pad.width=Math.round(padW*dpr);pad.height=Math.round(padH*dpr);ctx.setTransform(dpr*inkScale,0,0,dpr*inkScale,0,0);redraw();
}
function redraw(){
  ctx.clearRect(0,0,padW/inkScale,padH/inkScale);ctx.fillStyle=ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--ink').trim();
  ctx.lineCap='round';ctx.lineJoin='round';
  strokes.forEach(function(s){
    var p=s.points;ctx.lineWidth=s.width;
    if(p.length===1){ctx.beginPath();ctx.arc(p[0].x,p[0].y,s.width/2,0,Math.PI*2);ctx.fill();return;}
    ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(var i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke();
  });
}
function point(e){var r=pad.getBoundingClientRect(),p={x:Math.max(0,Math.min(padW,e.clientX-r.left))/inkScale,y:Math.max(0,Math.min(padH,e.clientY-r.top))/inkScale};spaceW=Math.max(spaceW,p.x+S.penWidth/2);spaceH=Math.max(spaceH,p.y+S.penWidth/2);return p;}
pad.addEventListener('pointerdown',function(e){
  if(activeId!==null || (e.pointerType==='mouse'&&e.button!==0))return;
  stopGapTimer();
  e.preventDefault();activeId=e.pointerId;pad.setPointerCapture(e.pointerId);
  current={width:S.penWidth,points:[point(e)]};strokes.push(current);controls();redraw();
});
function move(e){if(e.pointerId!==activeId||!current)return;e.preventDefault();current.points.push(point(e));redraw();}
pad.addEventListener('pointermove',move);
pad.addEventListener('pointerup',function(e){if(e.pointerId!==activeId)return;move(e);activeId=null;current=null;controls();scheduleCharacter();});
function cancelPointer(e){if(e.pointerId!==activeId)return;activeId=null;current=null;controls();scheduleCharacter();}
pad.addEventListener('pointercancel',cancelPointer);pad.addEventListener('lostpointercapture',cancelPointer);
function stopGapTimer(){if(gapTimer!==null){clearTimeout(gapTimer);gapTimer=null;}}
function scheduleCharacter(){stopGapTimer();if(strokes.length)gapTimer=setTimeout(commitCharacter,S.strokeGapMs);}
function clearInk(){stopGapTimer();strokes=[];current=null;sizePad();controls();}
$('undoInk').addEventListener('click',function(){if(activeId!==null)return;stopGapTimer();strokes.pop();redraw();controls();scheduleCharacter();say('ひとかく もどしました。');});
$('clearInk').addEventListener('click',function(){if(activeId!==null)return;clearInk();status('書き直せます。');say('かきなおせます。');});
$('deleteChar').addEventListener('click',function(){if(activeId!==null)return;ROW.pop();renderRow();controls();status('上段の最後の一文字を消しました。');});
function bounds(list){
  var x=Infinity,y=Infinity,right=-Infinity,bottom=-Infinity;
  list.forEach(function(s){var margin=s.width/2+2;s.points.forEach(function(p){x=Math.min(x,p.x-margin);y=Math.min(y,p.y-margin);right=Math.max(right,p.x+margin);bottom=Math.max(bottom,p.y+margin);});});
  return{x:x,y:y,width:Math.max(1,right-x),height:Math.max(1,bottom-y)};
}
function validInk(e){
  return e && e.type==='handwriting' && e.bounds && ['x','y','width','height'].every(function(k){return Number.isFinite(e.bounds[k]);}) && e.bounds.width>0 && e.bounds.height>0 && Array.isArray(e.strokes) && e.strokes.every(function(s){return Number.isFinite(s.width)&&s.width>0&&Array.isArray(s.points)&&s.points.length&&s.points.every(function(p){return Number.isFinite(p.x)&&Number.isFinite(p.y);});});
}
var NS='http://www.w3.org/2000/svg';
function svgFor(e){
  var b=e.bounds,svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',[b.x,b.y,b.width,b.height].join(' '));svg.setAttribute('width',b.width);svg.setAttribute('height',b.height);
  svg.setAttribute('role','img');svg.setAttribute('aria-label','確定した手書き');
  e.strokes.forEach(function(s){
    var p=s.points, el;
    if(p.length===1){el=document.createElementNS(NS,'circle');el.setAttribute('cx',p[0].x);el.setAttribute('cy',p[0].y);el.setAttribute('r',s.width/2);el.setAttribute('fill','currentColor');}
    else{el=document.createElementNS(NS,'polyline');el.setAttribute('points',p.map(function(v){return v.x+','+v.y;}).join(' '));el.setAttribute('fill','none');el.setAttribute('stroke','currentColor');el.setAttribute('stroke-width',s.width);el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');}
    svg.appendChild(el);
  });return svg;
}
function renderRow(){
  var cells=$('cells');cells.replaceChildren();
  if(!ROW.length){var empty=document.createElement('span');empty.id='rowEmpty';empty.textContent='ここに 手書きの文字が ならびます';cells.appendChild(empty);}
  ROW.forEach(function(ch){var cell=document.createElement('div');cell.className='cell';cell.appendChild(svgFor(ch));cells.appendChild(cell);});
  $('cellsWrap').scrollLeft=$('cellsWrap').scrollWidth;
}
function commitCharacter(){
  stopGapTimer();if(activeId!==null||!strokes.length)return;
  ROW.push({type:'handwriting',strokes:JSON.parse(JSON.stringify(strokes)),bounds:bounds(strokes)});
  clearInk();renderRow();status('一文字を上段に追加しました。文章ができたら「確定」を押してください。');
}
function renderLog(){
  var box=$('log');box.replaceChildren();var lastDate=null,group;
  if(!LOG.length){var empty=document.createElement('p');empty.id='emptyLog';empty.textContent='確定した手書きがここに並びます';box.appendChild(empty);}
  LOG.forEach(function(e){
    if(!e||typeof e!=='object')return;
    if(!group || lastDate!==e.date){lastDate=e.date;var date=document.createElement('div');date.className='logDate';date.textContent=e.date||'';box.appendChild(date);group=document.createElement('div');group.className='logEntries';box.appendChild(group);}
    var item=document.createElement('div');item.className='logItem';
    if(e.type==='handwriting-sentence'&&Array.isArray(e.characters)&&e.characters.every(validInk)){
      item.classList.add('sentence');var line=document.createElement('div');line.className='sentenceInk';e.characters.forEach(function(ch){line.appendChild(svgFor(ch));});item.appendChild(line);
    }else if(validInk(e)){
      // Each confirmation stays intact. Cards wrap without reordering strokes or flattening multiple lines.
      item.style.width=Math.max(64,88*e.bounds.width/e.bounds.height+18)+'px';item.appendChild(svgFor(e));
    }else{var text=document.createElement('div');text.className='b';text.textContent=e.text||'表示できない記録（書き出しで元データを保存できます）';item.appendChild(text);}
    var t=document.createElement('div');t.className='t';t.textContent=e.time||'';item.appendChild(t);group.appendChild(item);
  });box.scrollTop=box.scrollHeight;
}
$('confirmInk').addEventListener('click',function(){
  if(activeId!==null || (!strokes.length&&!ROW.length))return;
  if(logReadFailed){status('保存済みの記録を読み込めないため上書きしません。設定から記録を書き出してください。');return;}
  commitCharacter();
  var now=new Date(),p=function(n){return String(n).padStart(2,'0');};
  var entry={type:'handwriting-sentence',datetime:now.toISOString(),date:now.getFullYear()+'-'+p(now.getMonth()+1)+'-'+p(now.getDate()),time:p(now.getHours())+':'+p(now.getMinutes()),characters:JSON.parse(JSON.stringify(ROW))};
  var next=LOG.concat([entry]);

  try{localStorage.setItem(LKEY,JSON.stringify(next));}catch(e){status('保存できませんでした。上段の手書きは残しています。記録を書き出して空き容量をご確認ください。');say('ほぞん できませんでした。');return;}
  LOG=next;ROW=[];renderLog();clearInk();renderRow();status('文章を確定して右側に記録しました。');say('ぶんしょうを かくてい しました。');
});
function applySettings(){document.body.classList.toggle('hc',!!S.highContrast);$('penWidth').value=S.penWidth;$('strokeGapMs').value=S.strokeGapMs;$('guideLines').value=S.guideLines;$('padWrap').classList.toggle('noGuide',S.guideLines==='none');$('padWrap').classList.toggle('quarter',S.guideLines==='quarter');$('highContrast').checked=!!S.highContrast;$('speak').checked=!!S.speak;redraw();}
['penWidth','strokeGapMs','guideLines','highContrast','speak'].forEach(function(k){$(k).addEventListener('change',function(){S[k]=(k==='penWidth'||k==='strokeGapMs')?Number(this.value):(k==='guideLines'?this.value:this.checked);try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){status('設定を保存できませんでした。');}applySettings();if(k==='strokeGapMs'&&activeId===null)scheduleCharacter();});});
function closeSheet(){$('sheet').hidden=true;$('gear').focus();}
$('gear').addEventListener('click',function(){$('sheet').hidden=false;$('closeSheet').focus();});
$('closeSheet').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if($('sheet').hidden)return;if(e.key==='Escape')closeSheet();if(e.key==='Tab'){var items=$('sheet').querySelectorAll('button,input,select'),first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
$('exportLog').addEventListener('click',function(){
  var data={app:'Asa-Com2',version:3,records:LOG};

  a.href=url;a.download='asacom2_handwriting_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},1000);status('記録を書き出しました。');
});
$('clearLog').addEventListener('click',function(){
  if(!window.confirm('確定した記録をすべて消します。よろしいですか？'))return;
  try{localStorage.removeItem(LKEY);}catch(e){status('記録を消せませんでした。');return;}LOG=[];logReadFailed=false;renderLog();status('確定した記録を消しました。');
});
